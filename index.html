  [v0.27] 우측 상단 '내 구글시트' 바로가기 (마스터는 보고 있는 인원 시트)
  [v0.28] 전광판 추가 — 공지(마스터 등록·일간/주간/월간/직접 지정·고정), 이관완료 축하 + 한마디, 응원 👏, 게시판(지난 7일·더보기)
  [v0.29] 전광판 → NOTICE 표기 변경, 오늘의 한마디(명언 169 + 업무 문구 30, 날짜별 순환) 추가
  [v0.30] NOTICE 문구 겹침 수정, 관리·축하 창은 바깥 클릭으로 안 닫히게 변경
  [v0.31] 신규등록 예산칸 '만원' 겹침 수정, 폰트 나눔고딕으로 변경
  [v0.32] 상단 탭 '내 가망DB' → '나의 영업DB'
  [v0.33] 파일 맨 위 업데이트 기록 추가
  [v0.34] 예산 표시를 만원 단위로 통일 (예전 원 단위 4000000 → 400만원, 1억 이상은 '1억 2,000만원'), 예산 정렬도 만원 기준
  [v0.35] 이관 확인 창: 시트에서 바뀐 이관완료는 본인이 '오늘 이관'만 체크해서 게시(예전 건은 넘기기), 한마디 문구 '이관의 힘을 사원들에게 주세요!',

  [v0.38] 나의 영업DB 가망도 타일 0건이어도 항상 표시(단순재콜 누락 해결), 단순재콜 색(갈색) 추가

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미래아이엔씨 통합DB (파일럿) v0.42</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--surface:#fff;--surface2:#f5f7ff;--border:#e8eaf6;--text:#333;--text-sub:#4b5260;--text-muted:#6b7280;--header-bg:linear-gradient(135deg,#0B13E7,#080ead);--primary:#3949ab;--primary-soft:#e8eaf6;--th-bg:#e8eaf6;--danger:#c62828;--danger-soft:#fdecec;--warn:#e65100;--warn-soft:#fff3e8;--ok:#2e7d32;--ok-soft:#e9f5ea;--purple:#6a1b9a;--purple-soft:#f3e5f5;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nanum Gothic','NanumGothic','Malgun Gothic','Segoe UI',sans-serif;font-size:14px;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
.hidden{display:none!important;}
/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.hdr{background:var(--header-bg);color:#fff;}
.logo{width:34px;height:34px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.2);overflow:hidden;}
.logo img{width:26px;height:26px;object-fit:contain;}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;}
#viewPick{font-weight:700;cursor:pointer;}
#viewPick option{color:#333;background:#fff;}
.hbtn:hover{background:rgba(255,255,255,.2);}
.user-chip{background:rgba(255,255,255,.15);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.2);}
.top-in{max-width:1700px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:10px;}
.top h1{font-size:18px;margin:0;font-weight:700;color:#fff;}
.top h1 small{font-size:11px;opacity:.55;font-weight:400;margin-left:4px;}
.who{margin-left:auto;font-size:12px;display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text);}
.btn:hover{background:var(--surface2);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.sm{padding:4px 9px;font-size:12px;white-space:nowrap;}
.btn:disabled{opacity:.5;cursor:default;}
.test-banner{background:var(--warn-soft);color:var(--warn);font-size:12px;text-align:center;padding:5px;}
.tabs{max-width:1700px;margin:0 auto;padding:0 32px;display:flex;gap:4px;}
.tab{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--text-sub);border-bottom:2px solid transparent;}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
/* 신규등록 탭: 버튼형으로 클릭 유도 */
.tabs{align-items:center;}
.tab.tab-new{background:linear-gradient(135deg,#0B13E7,#3949ab);color:#fff;font-weight:700;border:none;border-radius:20px;padding:7px 16px 7px 12px;margin:6px 8px 6px 0;box-shadow:0 3px 10px rgba(11,19,231,.28);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:6px;}
.tab.tab-new .plus{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);font-size:15px;line-height:1;}
.tab.tab-new:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(11,19,231,.38);}
.tab.tab-new.on{color:#fff;border:none;box-shadow:0 0 0 3px rgba(11,19,231,.2),0 3px 10px rgba(11,19,231,.28);}
@keyframes newPulse{0%,100%{box-shadow:0 3px 10px rgba(11,19,231,.28);}50%{box-shadow:0 3px 18px rgba(11,19,231,.55);}}
.tab.tab-new:not(.on){animation:newPulse 2.4s ease-in-out infinite;}
/* 신규등록 블록: 명암 강조 */
.sec.new-box{background:linear-gradient(180deg,#eef0ff 0%,#fff 70%);border:1.5px solid #c5cae9;border-top:4px solid #0B13E7;box-shadow:0 6px 20px rgba(26,35,126,.12);}
.sec.new-box .sec-h{border-bottom-color:#dfe2f5;}
.sec.new-box .sec-h h3{font-size:16px;color:#1a237e;}
.sec.new-box .inp{background:#fff;border-color:#c5cae9;}
.uwrap{position:relative;display:block;}.uwrap .inp{padding-right:38px;width:100%;box-sizing:border-box;}.uwrap .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#8a8fa3;pointer-events:none;}
.sec.new-box .inp.ro{background:#eef0ff;}
.sec.new-box #nSave{padding:9px 22px;font-size:14px;background:linear-gradient(135deg,#0B13E7,#3949ab);border:none;box-shadow:0 3px 10px rgba(11,19,231,.25);}
.snip-sec{border-top:1px dashed #c5cae9;margin:0 14px;padding:10px 0 14px;}
.snip-h{display:flex;align-items:center;gap:8px;font-size:13px;color:#1a237e;margin-bottom:8px;}
.snip-h .n{font-size:11px;color:var(--text-muted);}
.snips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.snip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:5px 6px 5px 8px;min-width:0;}
.snip.has{background:#fff8e1;border-color:#ffe082;}
.snip .snum{font-size:11px;font-weight:700;color:var(--text-muted);width:14px;text-align:center;flex-shrink:0;}
.snip .inp{border:none;background:transparent;padding:5px 4px;font-size:13px;min-width:0;}
.snip .inp:focus{outline:none;background:#fff;border-radius:6px;}
.snip .scopy{flex-shrink:0;padding:4px 8px;}
@media (max-width:1100px){.snips{grid-template-columns:repeat(2,1fr);}}
/* 오늘 할 일 처리 목록 */
.thead,.tmain{display:grid;grid-template-columns:120px minmax(130px,1.2fr) 160px 90px minmax(180px,2.4fr) 140px 70px 230px;gap:10px;align-items:center;}
.thead{padding:8px 14px;font-size:11px;color:var(--text-muted);font-weight:700;border-bottom:1px solid var(--surface2);background:var(--surface2);}
.trow{border-bottom:1px solid var(--surface2);}
.trow:last-child{border-bottom:none;}
.trow.busy{opacity:.45;pointer-events:none;}
.tmain{padding:9px 14px;font-size:13px;}
.tmain>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tgrade{cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
.tgrade .caret{font-size:10px;color:var(--text-muted);}
.tgrade .gsel{padding:3px 4px;font-size:12px;width:110px;}
.tco{font-weight:700;cursor:pointer;}
.tco:hover{color:var(--primary);text-decoration:underline;}
.tph .cp{padding:1px 5px;font-size:11px;}
.tmemo{color:var(--text-sub);}
.tcnt,.tbud,.tmgr{color:var(--text-sub);font-size:12px;}
.tact{display:flex;gap:4px;justify-content:flex-end;}
.tact .act-done{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.tact .act-abs{color:var(--warn);border-color:#ffcc80;}
.texp{padding:0 14px 12px 144px;}
.dform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--primary-soft);border-radius:10px;padding:10px 12px;}
.dform #dMemo{flex:1;min-width:260px;}
.dform .dnext,.dform .dgrade{display:flex;align-items:center;gap:6px;}
.dform .dnext .inp{width:150px;}
.dform .quick{margin:0;}
.dform .dgrade .inp{width:120px;}
.tprog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-sub);}
.tprog .bar{width:180px;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.tprog .bar div{height:100%;background:var(--ok);border-radius:4px;transition:width .3s;}
details.simple-sec>summary{cursor:pointer;list-style:none;}
details.simple-sec>summary::-webkit-details-marker{display:none;}
details.simple-sec>summary h3::before{content:'▸ ';color:var(--text-muted);}
details.simple-sec[open]>summary h3::before{content:'▾ ';}
@media (max-width:1100px){.thead{display:none;}.tmain{grid-template-columns:1fr 1fr;}.tmain .tmemo{grid-column:1/-1;}.tact{grid-column:1/-1;justify-content:flex-start;}.texp{padding-left:14px;}}
.ext-frame{display:block;width:100%;height:calc(100vh - 230px);min-height:600px;border:none;background:#fff;}
.ext-sec .desc a{color:var(--primary);font-weight:600;text-decoration:none;}
.lc-cell{max-width:360px;}
.lc-date{white-space:nowrap;}
.lc-ago{color:var(--text-muted);}
.lc-memo{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;margin-top:2px;}
.gw-chip{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:4px;}
.gw-mid{background:#fffbea;}
.gw-mid .gw-chip{background:#fff3c4;color:#8a6d00;}
.gw-mid .lc-ago{color:#8a6d00;font-weight:700;}
.gw-high{background:#fff3e8;}
.gw-high .gw-chip{background:#ffe0c2;color:#c65100;}
.gw-high .lc-ago{color:#c65100;font-weight:700;}
.dfilter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.dfilter select.inp{width:auto;padding:7px 8px;}
.dfilter input[type=date].inp{width:150px;padding:7px 8px;}
.dfilter .fchip{padding:4px 10px;}
.tab .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-weight:700;}
main{max-width:1700px;margin:0 auto;padding:20px 32px;}
/* 로그인 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--header-bg);padding:16px;}
.login{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login h2{color:#1a237e;}
.login h2{margin:0 0 4px;font-size:18px;}
.login p{margin:0 0 18px;color:var(--text-sub);font-size:12px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--text-sub);font-weight:600;}
.field label .req{color:var(--danger);}
.field label .rec{color:var(--warn);font-weight:400;}
.inp{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--surface);color:var(--text);width:100%;}
.inp:focus{outline:2px solid var(--primary-soft);border-color:var(--primary);}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5;}
.err{color:var(--danger);font-size:12px;min-height:16px;margin-top:4px;}
/* 섹션/카드 */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);}
.sec-h h3{margin:0;font-size:14px;}
.sec-h .n{font-size:12px;color:var(--text-muted);}
.sec-h .desc{margin-left:auto;font-size:11px;color:var(--text-muted);}
.empty{padding:18px;text-align:center;color:var(--text-muted);font-size:13px;}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--surface2);cursor:pointer;}
.item:last-child{border-bottom:none;}
.item:hover{background:var(--surface2);}
.item .co{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .meta{font-size:12px;color:var(--text-sub);white-space:nowrap;}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;border:1px solid transparent;}
.g-단기{background:#e3f2fd;color:#1565c0;border-color:#90caf9;}
.g-장기{background:#ede7f6;color:#4527a0;border-color:#b39ddb;}
.g-권한오픈{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;}
.g-권한브리핑{background:#e0f2f1;color:#00695c;border-color:#80cbc4;}
.g-이관완료{background:#263238;color:#fff;}
.g-메일전송{background:#fff3e0;color:#e65100;border-color:#ffcc80;}
.g-희망건{background:#fce4ec;color:#ad1457;border-color:#f48fb1;}
.g-단순재콜{background:#efebe9;color:#5d4037;border-color:#bcaaa4;}
.g-기타{background:var(--surface2);color:var(--text-sub);border-color:var(--border);}
.chip{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-left:4px;}
.chip.warn{background:var(--warn-soft);color:var(--warn);}
.chip.danger{background:var(--danger-soft);color:var(--danger);}
.chip.ok{background:var(--ok-soft);color:var(--ok);}
.chip.plan{background:var(--primary-soft);color:var(--primary);}

<script>
// ── 설정 ──────────────────────────────────────────────────────────
// 파일럿 Apps Script 웹앱 주소. 비워두면 로그인 화면의 '서버 주소 설정'으로 입력 (이 브라우저에 저장됨)
// 테스트 기간 자동 로그인 (테스트 시트 하나만 연결된 동안만 사용). 파일럿 사원 확정되면 null로 바꾸면 로그인 화면이 다시 나옴
const AUTO_LOGIN = null;
const APP_VER = 'v0.42';   // 화면 버전. 바뀌면 이전 접속 기록(테스트 계정 등)을 버리고 다시 로그인
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycby040Dne4lMk2Ulgzf5gLG5CPFskadcI4jiBjhuBY7zuMaepufQBoHjoaxHcnVQ5Xvt/exec';
const PROMO_GRADES = ['단기','장기','권한오픈','권한+브리핑'];
const INACTIVE_GRADES = ['이관완료','선택없음','희망건'];
const S = { token:'', role:'', name:'', rows:[], today:'', grades:[], tab:'today', dbFilter:'전체', dbSearch:'', dbSort:{key:'default',dir:''}, dbDate:{field:'first',from:'',to:''}, openId:'' };

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function sstore(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null;}}
function apiUrl(){return store('m2_api')||DEFAULT_API_URL;}
function setApiUrl(){const v=prompt('파일럿 Apps Script 웹앱 주소 (…/exec)',apiUrl()||'');if(v===null)return;store('m2_api',v.trim()||null);}

// ── 서버 호출 (조회=GET, 저장=POST) ──────────────────────────────────
async function api(action,params,post){
  const url=apiUrl();
  if(!url)return{success:false,error:'서버 주소가 설정되지 않았습니다 (로그인 화면 하단 \'서버 주소 설정\')'};
  const p=Object.assign({token:S.token,role:S.role},S.master?{viewAs:S.viewAs}:{},params||{});
  try{
    const res=post
      ?await fetch(url,{method:'POST',body:JSON.stringify({action,params:p})})
      :await fetch(url+'?action='+encodeURIComponent(action)+'&params='+encodeURIComponent(JSON.stringify(p)));
    const j=await res.json();
    if(j&&j.expired){logout(true);}
    if(j&&j.celePending&&j.celePending.length)queueCele(j.celePending);
    return j;
  }catch(e){return{success:false,error:'서버 연결 실패: '+e.message};}
}
function toast(msg,ms){const t=document.getElementById('savingToast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._t);if(ms)toast._t=setTimeout(()=>t.classList.add('hidden'),ms);}
function hideToast(){document.getElementById('savingToast').classList.add('hidden');}

// ── 로그인 ────────────────────────────────────────────────────────
async function doLogin(){
  const role=document.getElementById('lgRole').value.trim(),pw=document.getElementById('lgPw').value;
  const err=document.getElementById('lgErr');err.textContent='';
  if(!role||!pw){err.textContent='사번과 비밀번호를 입력하세요';return;}
  err.textContent='확인 중…';
  const r=await api('auth',{role,password:pw});
  if(!r.success){err.textContent=r.error||'로그인 실패';return;}
  err.textContent='';S.token=r.token;S.role=r.role;S.name=r.name;S.master=!!r.master;S.members=r.members||[];S.viewAs=S.members[0]||'';
  sstore('m2_sess',JSON.stringify({token:r.token,role:r.role,name:r.name,testMode:r.testMode,master:S.master,members:S.members,viewAs:S.viewAs,ver:APP_VER}));
  enterApp(r.testMode);
}
function logout(expired){sstore('m2_sess',null);if(AUTO_LOGIN&&expired){S.token='';doLogin();return;}S.token='';S.rows=[];closeCard();document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');if(expired)document.getElementById('lgErr').textContent='세션이 만료되어 다시 로그인이 필요합니다';}
function enterApp(testMode){
  S.testMode=!!testMode;
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('whoName').textContent='👤 '+S.name;
  document.getElementById('testBanner').classList.toggle('hidden',!testMode);
  document.getElementById('btnLogout').classList.toggle('hidden',!!AUTO_LOGIN);
  // 마스터: 파일럿 인원 선택 (화면은 사원과 동일, 저장은 테스트 시트만 가능)
  const pick=document.getElementById('viewPick');
  if(S.master){pick.innerHTML=S.members.map(n=>'<option'+(n===S.viewAs?' selected':'')+'>'+esc(n)+'</option>').join('');pick.classList.remove('hidden');}
  else pick.classList.add('hidden');
  loadRows();
}
function changeViewAs(v){S.viewAs=v;S.openId='';closeCard();S.rptSel='';S.dbSearch='';const sb=document.getElementById('dbSearch');if(sb)sb.value='';
  try{const ss=JSON.parse(sstore('m2_sess')||'{}');ss.viewAs=v;sstore('m2_sess',JSON.stringify(ss));}catch(e){}loadRows();}
document.getElementById('lgPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ── 데이터 ────────────────────────────────────────────────────────
async function loadRows(){
  document.getElementById('tabToday').innerHTML='<div class="loading">불러오는 중…</div>';
  const r=await api('rows',{});
  if(!r.success){document.getElementById('tabToday').innerHTML='<div class="empty">'+esc(r.error||'불러오기 실패')+'</div>';return;}
  {const sl=document.getElementById('sheetLink');if(r.sheetUrl){sl.href=r.sheetUrl;sl.textContent='📄 '+(r.masterView?(r.viewAs||'')+' 구글시트':'내 구글시트');sl.classList.remove('hidden');}else sl.classList.add('hidden');}S.rows=r.rows;S.today=r.today;S.grades=r.grades;S.readOnly=!!r.readOnly;S.history=r.history||[];
  const tb=document.getElementById('testBanner');
  if(S.master){const v=r.viewAs||S.viewAs;tb.textContent=v==='(테스트 시트)'?'관리자 · 테스트 시트 · 저장하면 테스트 시트에 실제로 기록됨':'관리자 보기 · '+v+' 데이터 · 저장하면 오류 (테스트 시트에서만 저장 가능)';tb.classList.remove('hidden');}
  else if(S.readOnly){tb.textContent='불러오기 확인 단계(읽기 전용) · 저장은 아직 안 됨';tb.classList.remove('hidden');}
  if(r.assignedIds)toast('새 행 '+r.assignedIds+'건에 ID를 부여했음',2500);
  renderAll();syncAdTab();
  if(S.openId)openCard(S.openId);
  loadBoard();
}
function upsertRow(row){const i=S.rows.findIndex(x=>x.id===row.id);if(i>=0)S.rows[i]=row;else S.rows.push(row);}

// ── 날짜 유틸 ─────────────────────────────────────────────────────
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function isYmd(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function addBizDays(s,n){const d=parseYmd(s);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++;}return ymd(d);}
function diffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
function fmtD(s){const d=parseYmd(s);if(!d)return s||'-';return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' ('+'일월화수목금토'[d.getDay()]+')';}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── 행 파생값: 예정/완료/누락 ─────────────────────────────────────────
function derive(r){
  const t=S.today;
  const valid=r.recalls.filter(x=>isYmd(x.date));
  const done=valid.filter(x=>x.memo);                                // 메모 있음 = 실제 통화 기록
  const plans=valid.filter(x=>!x.memo&&x.date>=t).sort((a,b)=>a.date.localeCompare(b.date)); // 오늘 이후 메모 없는 칸 = 예정
  const past=valid.filter(x=>x.date<=t).sort((a,b)=>a.date.localeCompare(b.date));
  const lastContact=past.length?past[past.length-1].date:(isYmd(r.firstCall)?r.firstCall:'');
  // 다음 재콜 = M열 재콜예정일 우선, 없으면 재콜칸의 미래 날짜(메모 없음)
  const next=isYmd(r.nextRecall)?r.nextRecall:(plans.length?plans[0].date:'');
  // 누락: 지난 날짜 중 가장 최근 칸이 메모 없이 남아있고(14일 이내), 앞으로 예정도 없음
  const lastPast=past.length?past[past.length-1]:null;
  // 놓침: 예정일이 지났고(30일 이내) 그 날 이후 재콜 기록이 없음
  const missed=(next&&next<t&&diffDays(next,t)<=30&&!past.some(x=>x.date>=next))?next:'';
  const inactive=INACTIVE_GRADES.includes(r.grade)||gradeGroup(r.grade)==='미분류';   // 빈칸·선택없음(미분류)도 진행 중 아님
  const monthStart=t.slice(0,8)+'01';
  const promoMissing=(isYmd(r.firstCall)&&r.firstCall>=monthStart&&PROMO_GRADES.includes(r.grade))
    ?[!r.budgetNum&&'예산',!r.advertiserManager&&'담당자명',!r.phone&&'직통연락처',!r.email&&'이메일'].filter(Boolean):[];
  // 평균 재콜 간격: 첫콜 → 재콜들(오늘까지) 날짜 사이 간격의 평균
  const flow=[...new Set([isYmd(r.firstCall)?r.firstCall:null].concat(past.map(x=>x.date)).filter(Boolean))].sort();
  const gaps=[];for(let i=1;i<flow.length;i++){const g=diffDays(flow[i-1],flow[i]);if(g>0)gaps.push(g);}
  const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:0;
  // 간격 경고: 진행 중 가망건, 앞으로 잡힌 재콜예정일이 없고, 마지막 컨택 후 경과일이 평균 간격보다 길 때
  const since=lastContact?diffDays(lastContact,t):0;
  // 경고는 가망건(단기·장기·권한오픈·권한+브리핑)에만 표시
  const gapWarn=(PROMO_GRADES.includes(r.grade)&&avgGap>0&&gaps.length>=1&&!(next&&next>=t)&&since>avgGap)?(since>=avgGap*2?'high':'mid'):'';
  const lastMemoObj=past.filter(x=>x.memo).slice(-1)[0]||null;
  return{done,plans,past,next,lastContact,missed,inactive,promoMissing,recallCnt:past.length,avgGap,flow,since,gapWarn,lastMemoObj};
}
function gradeKey(g){return g==='전체'?'all':(g==='권한+브리핑'?'권한브리핑':(['단기','장기','권한오픈','이관완료','메일전송','희망건','단순재콜'].includes(g)?g:'기타'));}

const GRADE_ORDER=['이관완료','권한+브리핑','권한오픈','단기','장기','메일전송','희망건','단순재콜','미분류'];
function gradeGroup(g){return (!g||g==='선택없음')?'미분류':g;}
function gradeRank(g){const i=GRADE_ORDER.indexOf(gradeGroup(g));return i<0?GRADE_ORDER.length-1:i;}
function gradeBadge(g){const k=g==='권한+브리핑'?'권한브리핑':(['단기','장기','권한오픈','이관완료','메일전송','희망건','단순재콜'].includes(g)?g:'기타');return '<span class="badge g-'+k+'">'+esc(gradeGroup(g))+'</span>';}

async function postpone(id,next){
  rowBusy(id,true);toast('일정 변경 중…');
  const res=await api('recall',{id,memo:'',nextDate:next},true);hideToast();rowBusy(id,false);
  if(!res.success){alert(res.error||'저장 실패');return;}
  const pp=getPP();pp[id]=next;setPP(pp);
  upsertRow(res.row);renderAll();undoBar('재콜예정일 '+fmtD(next)+'로 미룸',res.undo,id);
}
function gradePick(id,el){

  el.innerHTML='<select class="inp gsel" onclick="event.stopPropagation()" onchange="saveGradeInline(\''+esc(id)+'\',this.value)" onblur="renderToday()">'+gradeOptions(r.grade,!r.grade)+'</select>';

}
async function saveGradeInline(id,g){
  const r=S.rows.find(x=>x.id===id);if(!r||g===r.grade){renderToday();return;}
  rowBusy(id,true);toast('가망도 저장 중…');
  const res=await api('update',{id,fields:{grade:g},base:{grade:r.grade}},true);hideToast();
  if(!res.success){if(res.row)upsertRow(res.row);renderAll();alert(res.error||'저장 실패');return;}
  upsertRow(res.row);renderAll();toast(r.grade+' → '+g,1500);
}
function renderToday(){
  const t=S.today,pp=getPP();
  const pending=[],simple=[],done=[],missed=[],new3=[],promo=[],overdue=[];
  S.rows.forEach(r=>{
    const d=derive(r),recToday=r.recalls.some(x=>x.date===t);
    if(recToday||pp[r.id])done.push(r);
    if(d.inactive)return;
    if(d.next===t&&!recToday)(r.grade==='단순재콜'?simple:pending).push(r);
    else if(d.missed&&!recToday&&r.grade!=='단순재콜')missed.push(r);
    else if(d.gapWarn&&!recToday)overdue.push(r);   // 평소 간격 초과 (가망건만, 위 목록과 중복 제외)
    if(PROMO_GRADES.includes(r.grade)&&isYmd(r.firstCall)&&diffDays(r.firstCall,t)<=3&&diffDays(r.firstCall,t)>=0&&d.past.length===0&&d.next!==t)new3.push(r);
    if(d.promoMissing.length)promo.push(r);
  });
  // 정렬: 가망도 높은 순(권한+브리핑 → 권한오픈 → 단기 → 장기) → 같은 가망도는 예산 큰 순
  const byPri=(a,b)=>gradeRank(a.grade)-gradeRank(b.grade)||(budgetMan(b.budget)||0)-(budgetMan(a.budget)||0);
  pending.sort(byPri);missed.sort(byPri);simple.sort(byPri);
  // 간격 초과: 2배 초과 먼저, 그다음 가망도·경과일 긴 순
  overdue.sort((a,b)=>{const da=derive(a),db=derive(b);return (da.gapWarn==='high'?0:1)-(db.gapWarn==='high'?0:1)||gradeRank(a.grade)-gradeRank(b.grade)||db.since-da.since;});
  const c=document.getElementById('cntToday');const cnt=pending.length+missed.length;c.textContent=cnt;c.classList.toggle('hidden',!cnt);
  const weekEnd=addDays(t,7);
  const weekPlans=S.rows.filter(r=>{const d=derive(r);return !d.inactive&&d.next>t&&d.next<=weekEnd;}).length;
  const newToday=S.rows.filter(r=>r.firstCall===t).length;
  const total=pending.length+done.length,pct=total?Math.round(done.length/total*100):0;
  const head='<div class="thead"><span>가망도</span><span>업체명</span><span>직통연락처</span><span>담당자</span><span>최근 메모</span><span>재콜 · 경과</span><span>예산</span><span></span></div>';
  const list=(arr,opt)=>arr.length?head+arr.map(r=>taskRow(r,opt)).join(''):'<div class="empty">없음</div>';
  const doneRows=done.map(r=>{const today=r.recalls.filter(x=>x.date===t);const memos=today.map(x=>x.memo).filter(Boolean);
    const lab=today.length?(memos.length&&memos.every(m=>m==='부재')?'<span class="chip warn">부재</span>':'<span class="chip ok">완료</span>'):'<span class="chip plan">미룸 → '+fmtD(pp[r.id])+'</span>';
    return '<div class="item" onclick="openCard(\''+esc(r.id)+'\')">'+gradeBadge(r.grade)+'<span class="co">'+esc(r.company)+'</span><span class="meta">'+lab+(memos.filter(m=>m!=='부재').length?' '+esc(memos.filter(m=>m!=='부재').join(' / ')):'')+(isYmd(r.nextRecall)&&r.nextRecall>t?' <span class="muted">· 다음 '+fmtD(r.nextRecall)+'</span>':'')+'</span></div>';}).join('');
  const simpleSec='<details class="sec simple-sec"'+(S.simpleOpen?' open':'')+' ontoggle="S.simpleOpen=this.open"><summary class="sec-h"><h3>단순재콜</h3><span class="n">'+simple.length+'건</span><span class="desc">오늘 예정 · 진행률 집계에서 제외 · 눌러서 펼치기</span></summary>'+list(simple)+'</details>';
  const sec=(title,desc,arr,metaFn)=>'<div class="sec"><div class="sec-h"><h3>'+title+'</h3><span class="n">'+arr.length+'건</span><span class="desc">'+desc+'</span></div>'+
    (arr.length?arr.map(r=>'<div class="item" onclick="openCard(\''+esc(r.id)+'\')">'+gradeBadge(r.grade)+'<span class="co">'+esc(r.company)+'</span><span class="meta">'+metaFn(r)+'</span></div>').join(''):'<div class="empty">없음</div>')+'</div>';
  document.getElementById('tabToday').innerHTML=
    '<div class="stats">'+
      '<div class="stat"><div class="v">'+pending.length+'</div><div class="l">오늘 남은 재콜</div></div>'+
      '<div class="stat"><div class="v" style="color:var(--ok)">'+done.length+'</div><div class="l">오늘 처리 (완료·부재·미룸)</div></div>'+
      '<div class="stat"><div class="v">'+newToday+'</div><div class="l">오늘 신규등록</div></div>'+
      '<div class="stat"><div class="v">'+weekPlans+'</div><div class="l">이번 7일 예정</div></div>'+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h3>오늘 재콜 예정</h3><span class="n">'+pending.length+'건 남음</span><div class="tprog"><div class="bar"><div style="width:'+pct+'%"></div></div><span>'+total+'건 중 '+done.length+'건 처리 ('+pct+'%)</span></div></div>'+list(pending)+'</div>'+
    '<div class="sec"><div class="sec-h"><h3>놓친 재콜</h3><span class="n">'+missed.length+'건</span><span class="desc">재콜예정일이 지났는데 기록 없음 (최근 30일)</span></div>'+list(missed,{missed:true})+'</div>'+
    '<div class="sec"><div class="sec-h"><h3>평소 간격 초과</h3><span class="n">'+overdue.length+'건</span><span class="desc">가망건 중 평균 재콜 간격보다 오래 연락 안 한 업체 · 재콜예정일 없음</span></div>'+list(overdue,{gap:true})+'</div>'+
    simpleSec+
    '<div class="sec"><div class="sec-h"><h3>오늘 완료</h3><span class="n">'+done.length+'건</span><span class="desc">오늘 재콜 기록·부재·미룸 처리한 업체</span></div>'+(doneRows||'<div class="empty">아직 없음</div>')+'</div>'+
    sec('신규 3일 팔로업','가망건 중 첫콜 3일 이내, 재콜 기록 없음',new3,r=>'첫콜 '+fmtD(r.firstCall))+
    sec('신규P 미인정','이번 달 신규 중 권장 항목 누락',promo,r=>'<span class="chip warn">'+derive(r).promoMissing.join('·')+' 없음</span>');
}

// 날짜 빠른 선택
function dbQuick(k){
  const t=S.today,d=parseYmd(t);let from='',to='';
  if(k==='today'){from=to=t;}
  else if(k==='week'){from=mondayOf(t);to=t;}
  else if(k==='month'){from=t.slice(0,8)+'01';to=t;}
  else if(k==='prev'){const p=new Date(d.getFullYear(),d.getMonth()-1,1),e=new Date(d.getFullYear(),d.getMonth(),0);from=ymd(p);to=ymd(e);}
  else if(k==='30'){from=addDays(t,-29);to=t;}
  S.dbDate.from=from;S.dbDate.to=to;
  document.getElementById('dbFrom').value=from;document.getElementById('dbTo').value=to;dbQuickSync();renderDb();
}
function dbQuickSync(){
  const t=S.today,d=parseYmd(t),f=S.dbDate.from,e=S.dbDate.to;let k='';
  if(!f&&!e)k='all';else if(f===t&&e===t)k='today';else if(f===mondayOf(t)&&e===t)k='week';else if(f===t.slice(0,8)+'01'&&e===t)k='month';
  else if(f===ymd(new Date(d.getFullYear(),d.getMonth()-1,1))&&e===ymd(new Date(d.getFullYear(),d.getMonth(),0)))k='prev';else if(f===addDays(t,-29)&&e===t)k='30';
  document.querySelectorAll('#dbQuick .fchip').forEach(b=>b.classList.toggle('on',b.dataset.q===k));
}
function renderDb(){

    list.sort((a,b)=>{if(a.d.next&&b.d.next)return a.d.next.localeCompare(b.d.next);if(a.d.next)return -1;if(b.d.next)return 1;return (a.d.lastContact||'').localeCompare(b.d.lastContact||'');});
  }else{
    const val=({grade:x=>gradeRank(x.r.grade),company:x=>x.r.company||null,firstCall:x=>isYmd(x.r.firstCall)?x.r.firstCall:null,lastContact:x=>x.d.lastContact||null,next:x=>x.d.next||null,recall:x=>x.d.recallCnt,avg:x=>x.d.avgGap||null,budget:x=>budgetMan(x.r.budget)})[sk];
    list.sort((a,b)=>{const va=val(a),vb=val(b);if(va===null&&vb===null)return 0;if(va===null)return 1;if(vb===null)return -1;   // 빈 값은 항상 맨 아래
      return (typeof va==='number'?va-vb:String(va).localeCompare(String(vb),'ko'))*dir;});

      '<input id="dbFrom" class="inp" type="date" onchange="S.dbDate.from=this.value;dbQuickSync();renderDb()"><span class="muted">~</span><input id="dbTo" class="inp" type="date" onchange="S.dbDate.to=this.value;dbQuickSync();renderDb()">'+
      '<span id="dbQuick">'+[['today','오늘'],['week','이번 주'],['month','이번 달'],['prev','지난달'],['30','최근 30일'],['all','전체']].map(o=>'<button class="fchip" data-q="'+o[0]+'" onclick="dbQuick(\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</span></div>'+

    document.getElementById('dbDateField').value=S.dbDate.field;document.getElementById('dbFrom').value=S.dbDate.from;document.getElementById('dbTo').value=S.dbDate.to;dbQuickSync();
    document.getElementById('dbSearch').value=S.dbSearch;
  }

  document.getElementById('dbCount').textContent=list.length+'건';

// ── 자주 쓰는 문구 (이 PC 브라우저에만 저장, 5칸, 신규등록 카드 안) ── 컨택포인트 등 반복 입력값을 눌러서 복사
const SNIP_N=5;
function snipKey(){return 'm2_snip_'+(S.role||'x');}
function loadSnips(){let a=[];try{a=JSON.parse(localStorage.getItem(snipKey())||'[]');}catch(e){}if(!Array.isArray(a))a=[];while(a.length<SNIP_N)a.push('');return a.slice(0,SNIP_N);}
function saveSnips(a){try{localStorage.setItem(snipKey(),JSON.stringify(a));return true;}catch(e){return false;}}
function renderSnips(){
  const el=document.getElementById('snipBox');if(!el)return;const a=loadSnips();
  el.innerHTML='<div class="snip-sec"><div class="snip-h"><b>⭐ 자주 쓰는 문구</b><span class="n">'+a.filter(Boolean).length+'/'+SNIP_N+'</span><span class="hint">이 컴퓨터 브라우저에만 저장 · 입력하면 자동 저장 · 📋 누르면 복사 → 원하는 칸에 Ctrl+V</span></div>'+
    '<div class="snips">'+a.map((v,i)=>'<div class="snip'+(v?' has':'')+'"><span class="snum">'+(i+1)+'</span><input class="inp" data-i="'+i+'" value="'+esc(v)+'" placeholder="'+(i===0?'예: 대표 직통':i===1?'예: 마케팅팀':'비어 있음')+'" oninput="snipInput(this)" onkeydown="if(event.key===\'Enter\')snipCopy('+i+')"><button class="btn sm scopy" title="복사" onclick="snipCopy('+i+')"'+(v?'':' disabled')+'>📋</button></div>').join('')+'</div></div>';
}
function snipInput(inp){
  const a=loadSnips(),i=+inp.dataset.i;a[i]=inp.value.trim();
  if(!saveSnips(a)){toast('이 브라우저에서는 저장할 수 없음 (시크릿 창 등)',2500);return;}
  const box=inp.parentElement;box.classList.toggle('has',!!a[i]);box.querySelector('.scopy').disabled=!a[i];
  const n=document.querySelector('.snip-sec .snip-h .n');if(n)n.textContent=a.filter(Boolean).length+'/'+SNIP_N;
}
function snipCopy(i){
  const v=loadSnips()[i];if(!v)return;
  const done=()=>toast('복사됨: '+(v.length>30?v.slice(0,30)+'…':v)+' → 원하는 칸에 Ctrl+V',1800);
  const fallback=()=>{const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){toast('복사 실패',1500);}t.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fallback);else fallback();
}

// ── 중복 확인 (본인 DB 안에서만): 업체명·URL·직통연락처 중 하나라도 겹치면 안내 + '이어서 기록' ──
function normCo(v){return String(v||'').toLowerCase().replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|\(사\)|사단법인/g,'').replace(/[\s.,·\-_'"]/g,'');}
const URL_FULL_PATH=/(^|\.)(smartstore\.naver\.com|blog\.naver\.com|m\.blog\.naver\.com|cafe\.naver\.com|instagram\.com|facebook\.com|youtube\.com|brand\.naver\.com|place\.naver\.com|map\.naver\.com|modoo\.at|tistory\.com|linktr\.ee)$/;
function normUrl(v){let u=String(v||'').trim().toLowerCase();if(!u)return '';u=u.replace(/^[a-z]+:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
  const host=u.split('/')[0];return URL_FULL_PATH.test(host)?u:host;}
function normPhone(v){const d=String(v||'').replace(/\D/g,'');return d.length>=8?d:'';}
function findDups(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const co=normCo(g('nCompany')),url=normUrl(g('nUrl')),ph=normPhone(g('nPhone'));
  if(!co&&!url&&!ph)return [];
  return S.rows.map(r=>{const why=[];
    if(co&&normCo(r.company)===co)why.push('업체명');
    if(url&&r.url&&normUrl(r.url)===url)why.push('URL');
    if(ph&&String(r.phone||'').split(/[\/,]/).some(x=>normPhone(x)===ph))why.push('번호');
    return why.length?{r,why}:null;}).filter(Boolean);
}
function dupCheck(){
  const el=document.getElementById('nDup');if(!el)return;const l=findDups();
  if(!l.length){el.innerHTML='';return;}
  el.innerHTML='<div class="dupbox"><div class="duph">⚠ 내 DB에 이미 있는 업체일 수 있음 · 같은 업체면 <b>이어서 기록</b>을 누르세요 (새 행 없이 기존 업체에 오늘 통화로 기록)</div>'+
    l.slice(0,5).map(({r,why})=>{const d=derive(r);return '<div class="dupr">'+gradeBadge(r.grade)+'<b>'+esc(r.company)+'</b>'+why.map(w=>'<span class="chip warn">'+w+' 일치</span>').join('')+
      '<span class="muted">첫콜 '+fmtD(r.firstCall)+(d.lastContact?' · 마지막 컨택 '+fmtD(d.lastContact):'')+'</span>'+
      '<span class="dupa"><button class="btn sm" onclick="openCard(\''+esc(r.id)+'\')">카드 보기</button><button class="btn sm primary" onclick="contAppend(\''+esc(r.id)+'\')">이어서 기록</button></span></div>';}).join('')+'</div>';
}
// 신규등록 폼 내용을 기존 업체에 이어서 기록: 첫콜내용 → 오늘 재콜 메모, 재콜예정일·가망도 반영, 기존에 비어 있던 칸만 채움
async function contAppend(id){
  const r=S.rows.find(x=>x.id===id);if(!r)return;
  const g=k=>(document.getElementById(k)||{}).value.trim();
  const memo=g('nContent'),next=g('nNext'),grade=g('nGrade');
  if(!memo){toast('G 첫콜내용 칸에 오늘 통화 내용을 적고 눌러주세요',2500);document.getElementById('nContent').focus();return;}
  if(!confirm('「'+r.company+'」에 이어서 기록할까요?\n· 오늘 재콜 메모: '+memo+(next?'\n· 재콜예정일: '+fmtD(next):'')+(grade&&grade!==r.grade?'\n· 가망도: '+(r.grade||'-')+' → '+grade:'')+'\n· 비어 있던 칸만 입력값으로 채움 (기존 값은 그대로)'))return;
  const fill={phone:g('nPhone'),url:g('nUrl'),budget:toManwon(g('nBudget'))||'',advertiserManager:g('nManager'),email:g('nEmail'),keyword:g('nKeyword'),rank:g('nRank'),contactPoint:g('nContactPoint')};
  const fields={},base={};Object.keys(fill).forEach(k=>{if(fill[k]&&!String(r[k]||'').trim()){fields[k]=fill[k];base[k]='';}});
  const params={id,memo,date:S.today};if(next)params.nextDate=next;if(grade&&grade!==r.grade)params.grade=grade;
  toast('기존 업체에 기록 중…');
  const res=await api('recall',params,true);
  if(!res.success){hideToast();alert(res.error||'저장 실패');return;}
  upsertRow(res.row);
  if(Object.keys(fields).length){const u=await api('update',{id,fields,base},true);if(u.success)upsertRow(u.row);else toast('메모는 기록됨 · 빈칸 채우기 실패: '+(u.error||''),3000);}
  hideToast();renderNew();renderToday();renderDb();openCard(id);
  undoBar('「'+r.company+'」에 이어서 기록함'+(Object.keys(fields).length?' · 빈칸 '+Object.keys(fields).length+'개 채움':''),res.undo);
}
async function saveNew(force){
  const g=id=>document.getElementById(id).value.trim();
  const data={company:g('nCompany'),phone:g('nPhone'),content:g('nContent'),grade:g('nGrade'),nextDate:g('nNext'),budget:toManwon(g('nBudget')),advertiserManager:g('nManager'),email:g('nEmail'),keyword:g('nKeyword'),rank:g('nRank'),url:g('nUrl'),contactPoint:g('nContactPoint')};
  const err=document.getElementById('nErr');
  const miss=[['grade','가망도'],['company','업체명'],['content','첫콜내용'],['phone','직통연락처']].filter(x=>!data[x[0]]).map(x=>x[1]);
  if(miss.length){err.textContent=miss.join(', ')+' 입력 필요';return;}
  const rec=[!data.budget&&'예산',!data.advertiserManager&&'담당자명',!data.email&&'이메일'].filter(Boolean);
  if(rec.length&&PROMO_GRADES.includes(data.grade)&&!force&&!confirm(rec.join(', ')+'이(가) 비어 있어 신규P로 인정되지 않음.\n그대로 등록할까요?'))return;
  const dups=findDups();
  if(!force&&dups.length){if(!confirm('내 DB에 비슷한 업체가 '+dups.length+'건 있음 ('+dups.slice(0,3).map(d=>d.r.company+': '+d.why.join('·')+' 일치').join(', ')+')\n\n다른 업체가 맞으면 [확인] → 새 행으로 등록\n같은 업체면 [취소] → 아래 목록에서 \'이어서 기록\'')){dupCheck();return;}force=true;}
  err.textContent='';const btn=document.getElementById('nSave');btn.disabled=true;toast('저장 중…');
  const r=await api('create',{data,force:!!force},true);
  btn.disabled=false;hideToast();
  if(!r.success){
    if(r.duplicate&&confirm(r.error+'\n같은 이름으로 그래도 등록할까요?'))return saveNew(true);
    err.textContent=r.error||'저장 실패';return;
  }
  upsertRow(r.row);renderNew();renderToday();renderDb();toast('등록 완료 · 아래 오늘 신규DB에 추가됨',2200);
}

// ── 리포트: 신규 · 재콜 · 이관 전환을 일별(영업일)/주별/월별로 집계 ─────────
// 출처: 신규=B열 첫콜날짜, 재콜=재콜칸 날짜(메모 없어도 포함), 이관=가망도이력(없으면 마지막 재콜일→첫콜일로 대체)
const RPT_COLORS={new:'#2a78d6',recall:'#eb6834',transfer:'#1baf7a'};
const RPT_LABEL={new:'신규',recall:'재콜',transfer:'이관 전환'};
function rptEvents(){
  const t=S.today,ev=[];
  S.rows.forEach(r=>{
    if(isYmd(r.firstCall)&&r.firstCall<=t)ev.push({type:'new',date:r.firstCall,r});
    r.recalls.forEach(x=>{if(isYmd(x.date)&&x.date<=t)ev.push({type:'recall',date:x.date,r,memo:x.memo});});
  });
  // 이관: 업체별 가장 최근 '이관완료' 기록 1건
  const byCo={};S.rows.forEach(r=>{byCo[r.company]=r;});
  const tr={};(S.history||[]).forEach(h=>{if(h.to==='이관완료'&&byCo[h.company]&&h.date<=t&&(!tr[h.company]||h.date>tr[h.company]))tr[h.company]=h.date;});
  S.rows.forEach(r=>{
    if(r.grade!=='이관완료')return;
    let d=tr[r.company],est=false;
    if(!d){const past=r.recalls.filter(x=>isYmd(x.date)&&x.date<=t).map(x=>x.date).sort();d=past.length?past[past.length-1]:(isYmd(r.firstCall)?r.firstCall:'');est=true;}
    if(d)ev.push({type:'transfer',date:d,r,est});
  });
  return ev;
}
function mondayOf(s){const d=parseYmd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function rptBuckets(mode){
  const t=S.today,out=[];
  if(mode==='day'){let d=parseYmd(t);while(out.length<30){const w=d.getDay();if(w!==0&&w!==6){const k=ymd(d);out.unshift({key:k,label:(d.getMonth()+1)+'/'+d.getDate(),title:fmtD(k)});}d.setDate(d.getDate()-1);}}
  else if(mode==='week'){let m=parseYmd(mondayOf(t));for(let i=0;i<12;i++){const k=ymd(m),e=new Date(m);e.setDate(e.getDate()+4);out.unshift({key:k,label:(m.getMonth()+1)+'/'+m.getDate()+'주',title:fmtD(k)+' 시작 주 (주말 기록 포함)'});m.setDate(m.getDate()-7);}}
  else{const d=parseYmd(t);d.setDate(1);for(let i=0;i<12;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');out.unshift({key:k,label:String(d.getFullYear()).slice(2)+'.'+(d.getMonth()+1),title:d.getFullYear()+'년 '+(d.getMonth()+1)+'월'});d.setMonth(d.getMonth()-1);}}
  return out;
}
function rptKey(date,mode){if(mode==='day'){const w=parseYmd(date).getDay();return (w===0||w===6)?null:date;}if(mode==='week')return mondayOf(date);return date.slice(0,7);}
function rptAggregate(mode){
  const bs=rptBuckets(mode),idx={};bs.forEach((b,i)=>{idx[b.key]=i;b.new=[];b.recall=[];b.transfer=[];});
  rptEvents().forEach(e=>{const k=rptKey(e.date,mode);if(k!==null&&idx[k]!==undefined)bs[idx[k]][e.type].push(e);});
  return bs;
}
// 막대그래프 (SVG 직접 그림): 같은 단위(건수) → 축 하나, 그룹 막대
function rptChart(id,bs,types){
  const W=Math.max(560,(document.getElementById('tabReport').clientWidth||1200)-30),H=240,padL=36,padR=8,padT=16,padB=30,iw=W-padL-padR,ih=H-padT-padB;
  const max=Math.max(1,...bs.map(b=>Math.max(...types.map(tp=>b[tp].length))));
  const step=max<=5?1:Math.ceil(max/4/5)*5||1,top=Math.ceil(max/step)*step,ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  const gw=iw/bs.length,gap=2,bw=Math.max(2,Math.min(22,(gw*0.72-gap*(types.length-1))/types.length));
  const y=v=>padT+ih-(v/top)*ih;
  const every=Math.ceil(bs.length/15);
  let g='';
  ticks.forEach(v=>{g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#e8eaf0" stroke-width="1"/><text x="'+(padL-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#8a8f9c">'+v+'</text>';});
  bs.forEach((b,i)=>{
    const gx=padL+gw*i+(gw-(bw*types.length+gap*(types.length-1)))/2;
    types.forEach((tp,j)=>{const v=b[tp].length;if(!v)return;const x=gx+j*(bw+gap),yy=y(v),h=padT+ih-yy,r=Math.min(4,bw/2,h);
      g+='<path d="M'+x+','+(padT+ih)+'V'+(yy+r)+'Q'+x+','+yy+' '+(x+r)+','+yy+'H'+(x+bw-r)+'Q'+(x+bw)+','+yy+' '+(x+bw)+','+(yy+r)+'V'+(padT+ih)+'Z" fill="'+RPT_COLORS[tp]+'"/>';
      if(types.length===1)g+='<text x="'+(x+bw/2)+'" y="'+(yy-4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#555">'+v+'</text>';});
    if(i%every===0||i===bs.length-1)g+='<text x="'+(padL+gw*i+gw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="#8a8f9c">'+esc(b.label)+'</text>';
    g+='<rect class="hit" x="'+(padL+gw*i)+'" y="'+padT+'" width="'+gw+'" height="'+ih+'" fill="transparent" data-i="'+i+'"'+(S.rptSel===b.key?' style="fill:rgba(57,73,171,.08)"':'')+'/>';
  });
  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+ih)+'" y2="'+(padT+ih)+'" stroke="#c9cdd6" stroke-width="1"/>';
  return '<div class="rchart" id="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="max-width:100%;height:auto;display:block;">'+g+'</svg><div class="rtip hidden"></div></div>';

function rptBindHover(id,bs,types){

      '<div><div class="rsub"><span class="rdot" style="background:'+RPT_COLORS.recall+'"></span>재콜 '+sel.recall.length+'건 ('+coCnt(sel)+'개 업체)</div>'+list('recall')+'</div>'+

function openCard(id){
  const r=S.rows.find(x=>x.id===id);if(!r)return;
  S.openId=id;
  const d=derive(r),t=S.today;
  // 타임라인: 첫콜 → 날짜순 재콜 (간격 표시)
  const items=[{type:'first',date:r.firstCall,memo:r.content}].concat(r.recalls.filter(x=>isYmd(x.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({type:x.memo?'done':(x.date>=t?'plan':'nomemo'),date:x.date,memo:x.memo})));
  if(isYmd(r.nextRecall)&&!items.some(it=>it.type==='plan'&&it.date===r.nextRecall))items.push({type:r.nextRecall>=t?'plan':'over',date:r.nextRecall,memo:''});
  const odd=r.recalls.filter(x=>!isYmd(x.date));
  let prev=isYmd(r.firstCall)?r.firstCall:'';
  const tl=items.map(it=>{
    const gap=(prev&&isYmd(it.date)&&it.type!=='first')?'<span class="tl-gap">+'+diffDays(prev,it.date)+'일</span>':'';
    if(it.type!=='plan'&&it.type!=='over')prev=it.date||prev;
    const label={first:'<span class="badge" style="background:var(--purple-soft);color:var(--purple)">첫콜</span>',done:'',plan:'<span class="chip plan">예정</span>',over:'<span class="chip danger">예정일 지남</span>',nomemo:'<span class="chip" style="background:var(--surface2);color:var(--text-muted)">메모 없음</span>'}[it.type];
    return '<div class="tl-i '+it.type+'"><div class="tl-d">'+label+(isYmd(it.date)?fmtD(it.date):esc(it.date||'날짜 없음'))+gap+'</div>'+(it.memo?'<div class="tl-m">'+esc(it.memo)+'</div>':'')+'</div>';
  }).join('')+(odd.length?'<div class="hint">날짜 형식이 아닌 재콜칸: '+odd.map(x=>esc(x.date)).join(', ')+'</div>':'');
  const tel=r.phone?'<a href="tel:'+esc(r.phone.replace(/[^0-9+]/g,''))+'">'+esc(r.phone)+'</a>':'<span class="muted">-</span>';
  const url=r.url?'<a href="'+esc(/^https?:/i.test(r.url)?r.url:'http://'+r.url)+'" target="_blank" rel="noopener">'+esc(r.url)+'</a>':'<span class="muted">-</span>';
  const v=x=>x?esc(x):'<span class="muted">-</span>';

    '<div class="dr-h"><div class="co">'+esc(r.company)+'<div class="hint" style="font-weight:400;margin-top:3px;">첫콜 '+fmtD(r.firstCall)+' · 재콜 '+d.recallCnt+'회'+(d.next?' · 다음 '+fmtD(d.next):'')+'</div></div>'+
    (S.readOnly?gradeBadge(r.grade):'<select class="inp" style="width:auto;" onchange="saveGrade(this)">'+gradeOptions(r.grade,!r.grade)+'</select>')+
    '<button class="btn sm" onclick="closeCard()">닫기</button></div>'+
    '<div class="dr-b">'+
      (S.readOnly?'':'<div class="box"><h4>재콜 기록</h4>'+
        '<div class="field"><label>메모</label><textarea id="cMemo" class="inp" placeholder="통화 내용 (비워두고 다음 재콜일만 바꿀 수도 있음)"></textarea></div>'+
        '<div class="grid2"><div class="field"><label>통화일</label><input id="cDate" class="inp" type="date" value="'+t+'" max="'+t+'"></div>'+
        '<div class="field"><label>다음 재콜일'+(d.next?' <span class="hint">(현재 '+fmtD(d.next)+' → 변경)</span>':'')+'</label><input id="cNext" class="inp" type="date" min="'+addDays(t,1)+'" onchange="syncQuick(\'c\',this.value)">'+quickDates('c','cNext')+'</div></div>'+
        '<button class="btn primary" id="cSave" onclick="saveRecall()">저장</button><div id="cErr" class="err"></div>'+
      '</div>')+
      '<div class="box"><h4>히스토리</h4><div class="tl">'+tl+'</div></div>'+
      '<div class="box" id="infoBox"><h4>업체 정보'+(S.readOnly?'':'<button class="btn sm r" onclick="editInfo()">수정</button>')+'</h4><div class="kv">'+
        '<div class="k">직통연락처</div><div class="v">'+tel+'</div>'+
        '<div class="k">예산</div><div class="v">'+recWarn(r.budget?fmtBudget(r.budget):'')+'</div>'+
        (isTestView()?'<div class="k">광고주ID</div><div class="v">'+(r.adCustomerId?esc(r.adCustomerId)+' <button class="btn sm primary" onclick="openAdAccount(\''+esc(r.adCustomerId)+'\')">광고 계정 열기 ↗</button>':'<span class="muted">없음 · 수정에서 입력</span>')+'</div>':'')+
        '<div class="k">담당자명</div><div class="v">'+recWarn(r.advertiserManager)+'</div>'+
        '<div class="k">이메일</div><div class="v">'+recWarn(r.email)+'</div>'+
        '<div class="k">키워드</div><div class="v">'+v(r.keyword)+(r.rank?' <span class="muted">('+esc(r.rank)+'위)</span>':'')+'</div>'+
        '<div class="k">URL</div><div class="v">'+url+'</div>'+
        '<div class="k">컨택포인트</div><div class="v">'+v(r.contactPoint)+'</div>'+

      '</div></div>'+

  document.getElementById('drawerWrap').classList.remove('hidden');
}

async function saveRecall(){
  const r=S.rows.find(x=>x.id===S.openId);if(!r)return;
  const memo=document.getElementById('cMemo').value.trim(),date=document.getElementById('cDate').value,nextDate=document.getElementById('cNext').value;
  const err=document.getElementById('cErr');
  if(!memo&&!nextDate){err.textContent='메모 또는 다음 재콜일을 입력하세요';return;}
  if(nextDate&&nextDate<=date){err.textContent='다음 재콜일은 통화일 이후여야 함';return;}
  if(memo&&!nextDate&&!(derive(r).next>date)&&!INACTIVE_GRADES.includes(r.grade)&&!confirm('재콜예정일을 새로 정하지 않았음 (현재 '+(derive(r).next?fmtD(derive(r).next):'없음')+').\n그대로 저장할까요?'))return;
  err.textContent='';document.getElementById('cSave').disabled=true;toast('저장 중…');
  const res=await api('recall',{id:r.id,memo,date,nextDate},true);
  hideToast();
  if(!res.success){document.getElementById('cSave').disabled=false;err.textContent=res.error||'저장 실패';return;}
  upsertRow(res.row);renderAll();openCard(res.row.id);undoBar('저장 완료',res.undo);
}
async function saveGrade(sel){
  const r=S.rows.find(x=>x.id===S.openId);if(!r)return;
  const g=sel.value;if(g===r.grade)return;
  toast('가망도 저장 중…');
  const res=await api('update',{id:r.id,fields:{grade:g},base:{grade:r.grade}},true);
  hideToast();
  if(!res.success){
    if(res.conflict&&res.row){upsertRow(res.row);renderAll();openCard(res.row.id);alert(res.error+'\n최신 값으로 다시 불러왔음');return;}
    alert(res.error||'저장 실패');sel.value=r.grade;return;
  }
  upsertRow(res.row);renderAll();openCard(res.row.id);toast(r.grade+' → '+g,1800);
}
// 예산: 만원 단위 숫자만 입력 → 시트엔 '300만원' 형태로 저장
function toManwon(v){v=String(v||'').trim();if(!v)return '';const m=v.replace(/,/g,'').match(/^(\d+(?:\.\d+)?)\s*(만원|만)?$/);return m?Number(m[1]).toLocaleString('ko-KR')+'만원':null;}
// 시트 예산 → 만원 단위 숫자 (예전 원 단위 '4000000' → 400, '300만원' → 300, '1억2000만' → 12000, 1만 미만 숫자는 만원으로 봄)
function budgetMan(v){const t=String(v||'').replace(/[,\s]/g,'');if(!t)return null;let m=t.match(/^(\d+(?:\.\d+)?)(만원|만)?$/);
  if(m){const n=+m[1];return m[2]?n:(n>=10000?n/10000:n);}
  m=t.match(/^(\d+(?:\.\d+)?)억(?:(\d+)(?:만원|만)?)?원?$/);if(m)return +m[1]*10000+(+m[2]||0);return null;}
function fmtBudget(v){const n=budgetMan(v);if(n===null)return String(v||'');
  if(n>=10000){const e=Math.floor(n/10000),r=Math.round(n%10000);return e+'억'+(r?' '+r.toLocaleString('ko-KR')+'만원':'원');}
  return (Math.round(n*10)/10).toLocaleString('ko-KR')+'만원';}
function budgetInp(attr,val){const man=budgetMan(val);const v=man!==null?String(Math.round(man*10)/10):(val||'');return '<span class="uwrap"><input '+attr+' class="inp" type="text" inputmode="numeric" placeholder="300" value="'+esc(v)+'" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"><span class="u">만원</span></span>';}
const EDIT_FIELDS_BASE=[['company','업체명'],['phone','직통연락처'],['budget','예산'],['advertiserManager','담당자명'],['email','이메일'],['keyword','키워드'],['rank','순위'],['url','URL'],['contactPoint','컨택포인트'],['content','첫콜 내용','textarea']];
function editFields(){return isTestView()?EDIT_FIELDS_BASE.concat([['adCustomerId','광고주ID (네이버 광고 고객ID, 테스트 시트만)']]):EDIT_FIELDS_BASE;}
function editInfo(){
  const r=S.rows.find(x=>x.id===S.openId);if(!r)return;
  document.getElementById('infoBox').innerHTML='<h4>업체 정보 수정</h4>'+editFields().map(([k,l,tp])=>'<div class="field"><label>'+l+'</label>'+(k==='budget'?budgetInp('data-k="budget"',r.budget):tp==='textarea'?'<textarea class="inp" data-k="'+k+'">'+esc(r[k])+'</textarea>':'<input class="inp" data-k="'+k+'" value="'+esc(r[k])+'">')+'</div>').join('')+
    '<div style="display:flex;gap:8px;"><button class="btn primary" id="eSave" onclick="saveInfo()">저장</button><button class="btn" onclick="openCard(S.openId)">취소</button></div><div id="eErr" class="err"></div>';
}
async function saveInfo(){
  const r=S.rows.find(x=>x.id===S.openId);if(!r)return;
  const fields={},base={};
  document.querySelectorAll('#infoBox [data-k]').forEach(el=>{const k=el.dataset.k;let v=el.value.trim();if(k==='budget'){const n=toManwon(v);if(n===null||(v!==''&&Number(v)===budgetMan(r.budget))||(v===''&&!r.budget))return;v=n;}if(v!==(r[k]||'')){fields[k]=v;base[k]=r[k]||'';}});
  const err=document.getElementById('eErr');
  if(!Object.keys(fields).length){openCard(r.id);return;}
  if(fields.company===''){err.textContent='업체명은 비울 수 없음';return;}
  document.getElementById('eSave').disabled=true;toast('저장 중…');
  const res=await api('update',{id:r.id,fields,base},true);
  hideToast();
  if(!res.success){
    if(res.conflict&&res.row){upsertRow(res.row);renderAll();alert(res.error+'\n최신 값으로 다시 불러왔으니 확인 후 다시 수정하세요');openCard(res.row.id);return;}
    document.getElementById('eSave').disabled=false;err.textContent=res.error||'저장 실패';return;
  }
  upsertRow(res.row);renderAll();openCard(res.row.id);toast('저장 완료',1500);
}

function todayQuote(){
  const d=parseYmd(S.today)||new Date();const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),dow=d.getDay();
  let pool=QUOTES;
  if(dow===1)pool=QUOTES.filter(q=>q[2]==='go');
  else if(dow===5)pool=QUOTES.filter(q=>q[2]==='fun'||q[2]==='mind');
  else if(n%3===2)return {id:'quote',kind:'명언',title:WORK_LINES[Math.floor(n/3)%WORK_LINES.length],src:''};
  const q=pool[(n*37)%pool.length];return {id:'quote',kind:'명언',title:q[0],src:q[1]};
}

function tsHM(ts){return String(ts).slice(11,16);}
function tsMD(ts){const d=parseYmd(String(ts).slice(0,10));return d?(d.getMonth()+1)+'/'+d.getDate():'';}

async function loadBoard(){
  if(!S.token)return;
  const r=await api('board',{page:0});
  if(!r||!r.success){BB.items=[todayQuote()];BB.pages=BB.pages||[];bbShow();return;}
  BB.items=(r.active||[]).concat([todayQuote()]);BB.pages=[{label:'지난 7일',items:r.list||[]}];BB.hasMore=!!r.hasMore;BB.page=0;BB.now=r.now;

  if(!document.getElementById('bmWrap').classList.contains('hidden')&&BB.view==='board')renderBoard();

  if(!BB.poll)BB.poll=setInterval(loadBoard,5*60*1000);

function bbShow(){

function bbRender(noAnim){
  const vp=document.getElementById('bbVp'),chip=document.getElementById('bbChip'),bb=document.getElementById('bb');
  const it=BB.items[BB.i];
  const html=it?bbLine(it):'<span class="t" style="color:var(--text-muted)">오늘 올라온 소식이 없음 · 클릭하면 지난 글 보기</span>';
  // 이전 줄은 전부 정리 (애니메이션 중에 다시 그려도 겹치지 않도록)
  const olds=[...vp.querySelectorAll('.bb-line')];const anim=!noAnim&&olds.length&&document.visibilityState==='visible';
  const n=document.createElement('div');n.className='bb-line'+(anim?' in':'');n.innerHTML=html;
  olds.forEach(o=>{if(anim&&!o.classList.contains('out')){o.classList.add('out');setTimeout(()=>o.remove(),520);}else o.remove();});
  vp.appendChild(n);
  if(anim){void n.offsetWidth;n.classList.remove('in');}
  const c=it?bbChip(it):['소식 없음','kc-none'];chip.textContent=c[0];chip.className='bb-chip '+c[1];
  bb.className='bb'+(it&&it.kind==='이관'?' k-cele':it&&it.pinned?' k-pin':'');

  if(it.kind==='명언')return '<div class="bp quote"><span class="tg kc-quote">💬 한마디</span><div class="bx"><div class="bh">'+esc(it.title)+'</div>'+(it.src?'<div class="bmeta">— '+esc(it.src)+'</div>':'')+'</div></div>';
  const c=bbChip(it),cls=it.kind==='이관'?'cele':it.pinned?'pin':'';
  const meta=it.kind==='이관'?(old?tsD(it.start)+' ':'')+tsHM(it.start):esc(it.author)+' · '+tsMD(it.start)+' 등록 · '+(old?tsMD(it.end)+' 종료':'~'+tsMD(it.end)+' 노출');
  const head=it.kind==='이관'?'<b>'+esc(celeName(it))+'</b>님 '+(it.count>1?'이관 '+it.count+'건을':'이관을')+' 축하드립니다!':'<b>'+esc(it.title)+'</b>';
  const body=it.kind==='이관'?(it.body?'“'+esc(it.body)+'”':''):esc(it.body);
  return '<div class="bp '+cls+(old?' old':'')+'"><span class="tg '+c[1]+'">'+c[0]+'</span><div class="bx"><div class="bh">'+head+'</div>'+(body?'<div class="bt">'+body+'</div>':'')+'<div class="bmeta">'+meta+'</div></div>'+
    '<button class="cheer'+(it.mine?' on':'')+'" data-cid="'+esc(it.id)+'" onclick="cheer(\''+esc(it.id)+'\')" title="응원하기">👏 '+(it.cheers||0)+'</button></div>';
}
function renderBoard(){
  const f=BB.filter,ok=it=>!f||(f==='공지'?it.kind==='공지':it.kind==='이관');
  document.getElementById('bmTabs').innerHTML=[['','전체'],['공지','📢 공지'],['이관','🎉 이관 축하']].map(([k,l])=>'<button class="'+(f===k?'on':'')+'" onclick="BB.filter=\''+k+'\';renderBoard()">'+l+'</button>').join('');
  const act=BB.items.filter(ok);
  let h='<div class="bm-day">지금 노출 중 · '+tsD(BB.now||'')+'</div>'+(act.length?act.map(it=>bpHtml(it,false)).join(''):'<div class="bm-day" style="font-weight:400">없음</div>');
  BB.pages.forEach(p=>{const l=p.items.filter(ok);h+='<div class="bm-day">'+p.label+'</div>'+(l.length?l.map(it=>bpHtml(it,true)).join(''):'<div class="bm-day" style="font-weight:400">없음</div>');});
  h+='<div style="text-align:center;margin:10px 0 4px">'+(BB.hasMore?'<button class="btn" id="bmMore" onclick="boardMore()">이전 7일 더보기 ▾</button>':'<span class="bm-day" style="font-weight:400">더 이전 글 없음</span>')+'</div>';
  const el=document.getElementById('bmList'),st=el.scrollTop;el.innerHTML=h;el.scrollTop=st;
}
async function boardMore(){
  const b=document.getElementById('bmMore');if(b){b.disabled=true;b.textContent='불러오는 중…';}
  const p=BB.page+1,r=await api('board',{page:p});
  if(!r||!r.success){toast((r&&r.error)||'불러오기 실패',2500);if(b){b.disabled=false;b.textContent='이전 7일 더보기 ▾';}return;}
  BB.page=p;BB.hasMore=!!r.hasMore;
  BB.pages.push({label:tsD(addTsDays(r.now,-7*(p+1)))+' ~ '+tsD(addTsDays(r.now,-7*p)),items:r.list||[]});
  renderBoard();
}
function addTsDays(ts,n){const d=parseYmd(String(ts).slice(0,10));if(!d)return '';d.setDate(d.getDate()+n);return ymd(d);}
async function cheer(id){
  const all=[].concat(BB.items,...BB.pages.map(p=>p.items),BB.mgr||[]).filter(x=>x.id===id);if(!all.length)return;
  const on=!all[0].mine;all.forEach(x=>{x.mine=on;x.cheers=(x.cheers||0)+(on?1:-1);});
  document.querySelectorAll('[data-cid="'+id+'"]').forEach(b=>{b.classList.toggle('on',on);b.textContent='👏 '+all[0].cheers;});
  bbRender(true);
  const r=await api('boardCheer',{id},true);
  if(!r||!r.success){toast((r&&r.error)||'응원 저장 실패',2500);return;}
  all.forEach(x=>{x.mine=r.mine;x.cheers=r.cheers;});
  document.querySelectorAll('[data-cid="'+id+'"]').forEach(b=>{b.classList.toggle('on',r.mine);b.textContent='👏 '+r.cheers;});
}

// ── 이관 축하 한마디 ──
const CELE_ASK='이관의 힘을 사원들에게 주세요! ✨';
function queueCele(list){BB.confirmQ=BB.confirmQ||[];list.forEach(c=>{const k=(c.type||'msg')+c.id;if(BB.celeSeen[k])return;BB.celeSeen[k]=1;if(c.type==='confirm')BB.confirmQ.push(c);else BB.celeQ.push(c);});if(document.getElementById('bmWrap').classList.contains('hidden'))showCele();}
function confetti(){const box=document.getElementById('bmBox'),cs=['#ffb300','#3949ab','#e53935','#1baf7a','#8e24aa'];
  for(let k=0;k<26;k++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'%';e.style.background=cs[k%5];e.style.animationDelay=(Math.random()*2)+'s';box.appendChild(e);}}
// 시트에서 바뀐 이관완료 확인 창 (오늘 이관 맞음 → 게시 / 아니면 패스)
function showConfirm(){
  const list=BB.confirmQ.splice(0);BB.view='confirm';BB.confirm=list;const c=list[0];
  openBm('<div class="big">🎉</div><h2>이관완료가 감지됐어요</h2><p>시트에서 이관완료로 바뀐 업체예요. <b>오늘 이관한 건만</b> 체크해 주세요.<br><span style="font-size:12px;color:var(--text-muted)">예전 이관을 정리한 거면 체크 없이 넘기면 됨 (NOTICE에 안 올라감)</span></p>'+
    '<div class="cf-list">'+list.map(x=>'<label class="cf-item"><input type="checkbox" class="cfChk" value="'+esc(x.id)+'" onchange="cfSync()"> <b>'+esc(x.company||'(업체명 없음)')+'</b><span>'+tsMD(x.detected)+' '+tsHM(x.detected)+' 감지</span></label>').join('')+'</div>'+
    '<div id="cfMsgBox" style="opacity:.45"><div class="cf-ask">'+CELE_ASK+'</div><textarea class="inp" id="celeMsg" rows="2" maxlength="50" style="width:100%;resize:none" placeholder="예: 끝까지 재콜한 보람이 있네요! 다들 화이팅 💪" oninput="celePrev()" disabled></textarea><div style="text-align:right;font-size:11px;color:var(--text-muted);margin-top:4px"><span id="celeCnt">0</span>/50</div>'+
    '<div class="cele-prev"><small>NOTICE 미리보기</small>🎉 <b>'+esc(celeName(c))+'</b>님 <span id="cfCnt">이관을</span> 축하드립니다! <span id="celePv" style="color:#555"></span></div></div>'+
    '<div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="sendConfirm(true)">오늘 이관 아님 (넘기기)</button><button class="btn primary" id="cfBtn" onclick="sendConfirm(false)" disabled>체크한 건 NOTICE에 올리기</button></div>','cele-box');
}
function cfSync(){const n=document.querySelectorAll('.cfChk:checked').length;document.getElementById('cfBtn').disabled=!n;const mb=document.getElementById('cfMsgBox');mb.style.opacity=n?1:.45;document.getElementById('celeMsg').disabled=!n;document.getElementById('cfCnt').textContent=n>1?'이관 '+n+'건을':'이관을';}
async function sendConfirm(skipAll){
  const all=(BB.confirm||[]).map(x=>x.id),ok=skipAll?[]:[...document.querySelectorAll('.cfChk:checked')].map(e=>e.value);
  const pass=all.filter(id=>ok.indexOf(id)<0),msg=skipAll?'':((document.getElementById('celeMsg')||{}).value||'').trim();
  document.querySelectorAll('.cele-box .btn').forEach(b=>b.disabled=true);
  const r=await api('boardConfirm',{ok,pass,msg},true);
  if(!r||!r.success){toast((r&&r.error)||'저장 실패',2500);document.querySelectorAll('.cele-box .btn').forEach(b=>b.disabled=false);return;}
  toast(ok.length?'🎉 NOTICE에 올라갔음':'넘겼음 (NOTICE에 안 올라감)',2000);
  closeBm();loadBoard();
}
function showCele(){
  if(BB.confirmQ&&BB.confirmQ.length)return showConfirm();
  const c=BB.celeQ.shift();if(!c)return;BB.view='cele';BB.cele=c;
  openBm('<div class="big">🎉</div><h2>이관 완료를 축하합니다!</h2><p>남긴 한마디는 24시간 동안 NOTICE에 함께 노출됩니다</p>'+
    '<div class="cf-ask">'+CELE_ASK+'</div><textarea class="inp" id="celeMsg" rows="2" maxlength="50" style="width:100%;resize:none" placeholder="예: 끝까지 재콜한 보람이 있네요! 다들 화이팅 💪" oninput="celePrev()"></textarea><div style="text-align:right;font-size:11px;color:var(--text-muted);margin-top:4px"><span id="celeCnt">0</span>/50</div>'+
    '<div class="cele-prev"><small>NOTICE 미리보기</small>🎉 <b>'+esc(celeName(c))+'</b>님 이관을 축하드립니다! <span id="celePv" style="color:#555"></span></div>'+
    '<div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="sendCele(true)">건너뛰기 (기본 문구만)</button><button class="btn primary" id="celeBtn" onclick="sendCele(false)">NOTICE에 올리기</button></div>','cele-box');
  confetti();
  setTimeout(()=>{const t=document.getElementById('celeMsg');if(t)t.focus();},100);
}
function celePrev(){const v=document.getElementById('celeMsg').value;document.getElementById('celeCnt').textContent=v.length;document.getElementById('celePv').textContent=v?'“'+v+'”':'';}
async function sendCele(skip){
  const c=BB.cele;if(!c)return;const msg=(document.getElementById('celeMsg')||{}).value||'';
  if(!skip&&!msg.trim()){skip=true;}
  const b=document.getElementById('celeBtn');if(b)b.disabled=true;
  const r=await api('boardCele',{id:c.id,msg:msg.trim(),skip},true);
  if(!r||!r.success){toast((r&&r.error)||'저장 실패',2500);if(b)b.disabled=false;return;}
  toast(skip?'NOTICE에 축하 문구가 올라갔음':'한마디가 NOTICE에 올라갔음',2000);
  closeBm();loadBoard();
}

// ── 관리 (마스터) ──
const PERIOD_L={day:'일간',week:'주간',month:'월간',custom:'직접'};
async function openMgr(){BB.view='mgr';BB.edit=null;BB.per='day';openBm('<h3>📢 NOTICE 관리 <span style="font-size:12px;color:var(--text-muted);font-weight:400">마스터 전용</span></h3><div id="bfForm"></div><div class="bm-list" id="bmMgr"><div class="loading">불러오는 중…</div></div>','');renderMgrForm();loadMgr();}
async function loadMgr(){const r=await api('board',{page:0,manage:true});if(!r||!r.success){document.getElementById('bmMgr').innerHTML='<div class="empty">'+esc((r&&r.error)||'불러오기 실패')+'</div>';return;}BB.mgr=r.manage||[];BB.mgrNow=r.now;renderMgrList();}
function perHint(){const n=S.today||ymd(new Date()),d=parseYmd(n),add=k=>{const x=new Date(d);x.setDate(x.getDate()+k);return (x.getMonth()+1)+'/'+x.getDate();};
  return {day:'지금부터 24시간',week:'지금부터 7일 (~'+add(7)+')',month:'지금부터 30일 (~'+add(30)+')',custom:'시작일 0시 ~ 종료일 24시'}[BB.per];}
function renderMgrForm(reset){
  // 기간 버튼 눌러 다시 그릴 때 입력 중인 내용 유지
  const gv=id=>{const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:el.value):undefined;};
  const keep=!reset&&document.getElementById('bfTitle')?{title:gv('bfTitle'),body:gv('bfBody'),pinned:gv('bfPin'),from:gv('bfFrom'),to:gv('bfTo')}:null;
  const e=keep?Object.assign({},BB.edit||{},keep,{start:keep.from?keep.from+' 00:00:00':(BB.edit||{}).start,end:keep.to?addTsDays(keep.to,1)+' 00:00:00':(BB.edit||{}).end}):(BB.edit||{});const per=BB.per;
  document.getElementById('bfForm').innerHTML='<div class="bf">'+(BB.edit?'<div style="font-size:12px;font-weight:700;color:var(--warn)">✏️ 공지 수정 중 · <button class="lk" onclick="BB.edit=null;BB.per=\'day\';renderMgrForm(true)">새 공지로</button></div>':'')+
    '<div><label class="l">제목 <span style="font-weight:400;color:var(--text-muted)">· NOTICE에 흐르는 한 줄 (40자)</span></label><input class="inp" id="bfTitle" maxlength="40" value="'+esc(e.title||'')+'" placeholder="예: 10/17(금) 오후 3시 BM본부 전체 회의"></div>'+
    '<div><label class="l">본문 <span style="font-weight:400;color:var(--text-muted)">· 게시판에서 보이는 내용 (선택)</span></label><textarea class="inp" id="bfBody" rows="3" maxlength="1000" placeholder="예: 장소: 대회의실&#10;주간 실적 각자 지참">'+esc(e.body||'')+'</textarea></div>'+
    '<div class="frow"><div><label class="l">노출 기간</label><div class="seg">'+['day','week','month','custom'].map(k=>'<button class="'+(per===k?'on':'')+'" onclick="BB.per=\''+k+'\';renderMgrForm()">'+(k==='custom'?'직접 지정':PERIOD_L[k])+'</button>').join('')+'</div></div>'+
    (per==='custom'?'<div><label class="l">시작일</label><input class="inp" type="date" id="bfFrom" value="'+esc(e.start?e.start.slice(0,10):(S.today||''))+'"></div><div><label class="l">종료일</label><input class="inp" type="date" id="bfTo" value="'+esc(e.end?addTsDays(e.end,-1):(S.today||''))+'"></div>':'')+
    '<div><label class="l">옵션</label><label style="display:flex;gap:6px;align-items:center;height:34px;font-size:13px"><input type="checkbox" id="bfPin"'+(e.pinned?' checked':'')+'> 📌 상단 고정 (항상 먼저)</label></div>'+
    '<div style="margin-left:auto"><button class="btn primary" id="bfSave" onclick="saveNotice()">'+(BB.edit?'수정 저장':'등록')+'</button></div></div>'+
    '<div class="hint">노출: '+(BB.edit&&per!=='custom'?'처음 등록 시각부터 '+PERIOD_L[per]+' 기간':perHint())+'</div><div id="bfErr" class="err"></div></div>';
}
async function saveNotice(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const p={title:g('bfTitle'),body:g('bfBody'),period:BB.per,pinned:document.getElementById('bfPin').checked,from:g('bfFrom'),to:g('bfTo')};
  if(BB.edit)p.id=BB.edit.id;
  const err=document.getElementById('bfErr');if(!p.title){err.textContent='제목을 입력하세요';return;}
  if(p.period==='custom'&&(!p.from||!p.to||p.from>p.to)){err.textContent='시작일·종료일을 확인하세요';return;}
  const b=document.getElementById('bfSave');b.disabled=true;
  const r=await api('boardSave',p,true);
  if(!r||!r.success){err.textContent=(r&&r.error)||'저장 실패';b.disabled=false;return;}
  toast(BB.edit?'공지 수정됨':'공지 등록됨',1800);BB.edit=null;BB.per='day';renderMgrForm(true);loadMgr();loadBoard();
}
function mgrState(it){const n=BB.mgrNow||'';
  if(it.status==='숨김')return['<span class="st-off">숨김</span>','show'];
  if(it.status==='취소')return['<span class="st-off">이관 취소됨</span>',''];
  if(it.status==='패스')return['<span class="st-off">예전 건 (게시 안 함)</span>',''];
  if(it.status==='확인대기')return it.end<=n?['<span class="st-off">확인 만료</span>','']:['<span class="st-on" style="color:var(--warn)">본인 확인 대기</span>','confirm'];
  if(it.start>n)return['<span class="st-on" style="color:var(--primary)">예약</span>','hide'];
  if(it.end<=n)return['<span class="st-off">종료</span>',it.kind==='공지'?'show':''];
  return['<span class="st-on">노출 중</span>','hide'];}
function renderMgrList(){
  const l=BB.mgr||[];
  document.getElementById('bmMgr').innerHTML='<table class="bmt"><thead><tr><th>종류</th><th>내용</th><th>기간</th><th>응원</th><th>상태</th><th></th></tr></thead><tbody>'+
    (l.length?l.map(it=>{const c=bbChip(it),st=mgrState(it);
      const txt=it.kind==='이관'?esc(celeName(it))+(it.company?' <span class="muted">('+esc(it.company)+')</span>':'')+' · '+(it.body?'“'+esc(it.body)+'”':'<span class="muted">(기본 문구)</span>'):'<b>'+esc(it.title)+'</b>'+(it.body?'<div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px">'+esc(it.body)+'</div>':'');
      const per=it.kind==='이관'?(it.status==='확인대기'?'감지 '+tsMD(it.created||it.start)+' '+tsHM(it.created||it.start):'24시간 · '+tsMD(it.start)+' '+tsHM(it.start)):(PERIOD_L[it.period]||'')+' · '+tsMD(it.start)+'~'+tsMD(addTsDays(it.end,it.end.slice(11)==='00:00:00'?-1:0));
      return '<tr><td><span class="tg bb-chip '+c[1]+'" style="font-size:11px;padding:2px 8px">'+c[0]+'</span></td><td>'+txt+'</td><td style="white-space:nowrap;font-size:12px">'+per+'</td><td style="white-space:nowrap">👏 '+(it.cheers||0)+'</td><td style="white-space:nowrap">'+st[0]+'</td><td style="white-space:nowrap">'+
        (it.kind==='공지'?'<button class="lk" onclick="editNotice(\''+esc(it.id)+'\')">수정</button>':'')+
        (st[1]==='confirm'?'<button class="lk" onclick="setBStatus(\''+esc(it.id)+'\',\'노출\')">대신 게시</button><button class="lk" onclick="setBStatus(\''+esc(it.id)+'\',\'패스\')">패스</button>':'')+
        (st[1]==='hide'?'<button class="lk" onclick="setBStatus(\''+esc(it.id)+'\',\'숨김\')">'+(it.kind==='이관'?'숨기기':'내리기')+'</button>':st[1]==='show'?'<button class="lk" onclick="setBStatus(\''+esc(it.id)+'\',\'노출\')">다시 노출</button>':'')+'</td></tr>';}).join(''):'<tr><td colspan="6" class="empty">등록된 글 없음</td></tr>')+'</tbody></table>';
}
function editNotice(id){const it=(BB.mgr||[]).find(x=>x.id===id);if(!it)return;BB.edit=it;BB.per=it.period||'day';renderMgrForm(true);document.getElementById('bfTitle').focus();}
async function setBStatus(id,status){const r=await api('boardStatus',{id,status},true);if(!r||!r.success){toast((r&&r.error)||'변경 실패',2500);return;}toast(status==='숨김'?'NOTICE에서 내렸음':status==='패스'?'패스 처리함':'NOTICE에 올렸음',1800);loadMgr();loadBoard();}
</script>
</body>
</html>
