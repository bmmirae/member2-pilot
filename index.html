          알림 토스트 오른쪽 아래, 숫자 고정폭, 첫 로딩 때 회색 뼈대 화면
  [v0.82] master 모드에서도 사원 화면 버튼 전부 표시(통화완료·부재·미루기·가망도·상세 기록·정보 수정, 메뉴의 목표·관리계정) — 사원 시트 저장은 서버에서 계속 막힘

<title>미래아이엔씨 통합DB v1.01</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--surface:#fff;--surface2:#f5f7ff;--border:#e8eaf6;--text:#333;--text-sub:#4b5260;--text-muted:#6b7280;--header-bg:linear-gradient(135deg,#0B13E7,#080ead);--primary:#3949ab;--primary-soft:#e8eaf6;--th-bg:#e8eaf6;--danger:#c62828;--danger-soft:#fdecec;--warn:#e65100;--warn-soft:#fff3e8;--ok:#2e7d32;--ok-soft:#e9f5ea;--purple:#6a1b9a;--purple-soft:#f3e5f5;}

button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
.hidden{display:none!important;}
/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.hdr{background:var(--header-bg);color:#fff;}
.logo{width:34px;height:34px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.2);overflow:hidden;}
.logo img{width:26px;height:26px;object-fit:contain;}
.hbtn{white-space:nowrap;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;}
select.hbtn option,select.hbtn optgroup{color:#1f2547;background:#fff;}select.hbtn optgroup{color:#1a237e;font-weight:800;}select.hbtn option.tgrp{color:#5c6bc0;font-weight:700;}   /* 펼친 목록은 흰 바탕 + 진한 글씨 (버튼 흰 글씨 상속 방지) */
#viewPick{font-weight:700;cursor:pointer;}

.hbtn:hover{background:rgba(255,255,255,.2);}

.top-in{max-width:1700px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:10px;}
.top h1{font-size:18px;margin:0;font-weight:700;color:#fff;}
.top h1 small{font-size:11px;opacity:.55;font-weight:400;margin-left:4px;}
.who{margin-left:auto;font-size:12px;display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text);}
.btn:hover{background:var(--surface2);}

.tabs{max-width:1700px;margin:0 auto;padding:0 32px;display:flex;gap:4px;}
.tab{border:none;background:none;padding:10px 14px;font-size:14px;color:var(--text-sub);border-bottom:2px solid transparent;}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
/* 신규등록 탭: 버튼형으로 클릭 유도 */
.tabs{align-items:center;}
.tab.tab-new{background:linear-gradient(135deg,#0B13E7,#3949ab);color:#fff;font-weight:700;border:none;border-radius:20px;padding:7px 16px 7px 12px;margin:6px 8px 6px 0;box-shadow:0 3px 10px rgba(11,19,231,.28);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:6px;}

.snip-h{cursor:pointer;user-select:none;}.snip-arr{font-size:12px;color:var(--primary);font-weight:600;}.snip-sec.folded{padding-bottom:10px;}.snip-sec.folded .snip-h{margin-bottom:0;}
.snips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}

.thead{padding:8px 14px;font-size:11px;color:var(--text-muted);font-weight:700;border-bottom:1px solid var(--surface2);background:var(--surface2);}

.tmain{padding:9px 14px;font-size:13px;cursor:pointer;}.tmain:hover{background:#f7f8ff;}.tmain .tgrade,.tmain .tact,.tmain .tph button{cursor:default;}.tmain .tact button,.tmain .tph button,.tmain .tgrade{cursor:pointer;}

.tco{font-weight:700;cursor:pointer;}
.tkw{display:block;font-weight:400;font-size:11.5px;color:#4b5260;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kwc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.kw-r{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;background:#e8eaf6;color:#3949ab;font-size:11px;font-weight:700;}
.tco:hover{color:var(--primary);text-decoration:underline;}
.tph .cp{padding:1px 5px;font-size:11px;}
.tmemo{color:var(--text-sub);}

.tact .act-done,.dr-acts .act-done{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

.texp{padding:0 14px 12px 144px;}

details.simple-sec>summary{cursor:pointer;list-style:none;}

.dfilter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

.tab .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;font-weight:700;}
main{max-width:1700px;margin:0 auto;padding:20px 32px;}
/* NOTICE 줄 고정 (상단 헤더 바로 아래) · 신규등록 탭은 등록 카드도 그 아래 고정 — --topH는 헤더 높이(스크립트가 맞춤) */

.sg-mf{display:grid;gap:8px;background:#f5f7ff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:12px;}
.sg-mf .l,.sgf .l{font-size:12px;color:#777;font-weight:600;}
.sgf{display:grid;gap:8px;}.sgf .l span{font-weight:400;color:var(--text-muted);}
.sg-drop{border:2px dashed #c5cae9;border-radius:12px;padding:16px;text-align:center;font-size:13px;color:#5c6bc0;background:#f8f9ff;cursor:pointer;}
.sg-drop.over{background:#e8eaf6;border-color:var(--primary);}
.sg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
.sg-zoom{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
.sg-zoom img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff;}
.cele-box{width:440px;text-align:center;overflow:hidden;}
.cele-box .big{font-size:46px;line-height:1;}
.cele-box h2{margin:10px 0 4px;font-size:20px;}.cele-box p{margin:0 0 16px;color:#777;font-size:13px;}
.cele-prev{background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;text-align:left;font-size:13px;margin:12px 0 16px;}
.cf-list{text-align:left;max-height:180px;overflow:auto;border:1px solid #eef0f7;border-radius:10px;padding:6px 10px;margin-bottom:12px;}
.cf-item{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:14px;cursor:pointer;flex:1;min-width:0;}
.cf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px dashed #eef0f7;padding:2px 0;}.cf-row:last-child{border-bottom:none;}
.cf-amt{position:relative;display:inline-block;}.cf-amt .inp{width:120px;padding:6px 38px 6px 10px;font-size:13px;text-align:right;}.cf-amt .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:#8a8fa3;pointer-events:none;}
.cf-amt .inp:disabled{background:#f5f6fa;}.cf-est{font-size:11px;color:#6b7280;white-space:nowrap;}
.cf-note{font-size:11.5px;color:#6b7280;margin:-4px 0 12px;text-align:left;}
.cf-amtbox{background:#f7f8ff;border:1px solid #d6dbf5;border-radius:10px;padding:10px 12px;margin-bottom:12px;text-align:left;}
.bb-band{color:#a07800;font-weight:700;}.cf-item span{margin-left:auto;font-size:11px;color:var(--text-muted);}
.cf-ask{font-weight:700;color:#a07800;font-size:14px;margin-bottom:6px;text-align:left;}
.cele-prev small{display:block;color:#a07800;font-weight:700;margin-bottom:4px;font-size:11px;}
.conf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:conf 2.2s linear infinite;opacity:.9;}
@keyframes conf{to{transform:translateY(520px) rotate(540deg);}}
.bf{display:grid;gap:10px;background:#f5f7ff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
.bf label.l{font-size:12px;color:#777;font-weight:600;display:block;margin-bottom:4px;}
.bf .frow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid #c5cae9;border-radius:8px;overflow:hidden;}
.seg button{border:none;background:#fff;padding:7px 14px;font-size:13px;color:#555;border-right:1px solid #c5cae9;}.seg button:last-child{border-right:none;}.seg button.on{background:var(--primary);color:#fff;font-weight:700;}
.bf .hint{font-size:12px;color:var(--primary);background:#e8eaf6;border-radius:6px;padding:6px 10px;}
.bmt{width:100%;border-collapse:collapse;font-size:13px;}.bmt th{background:#e8eaf6;text-align:left;padding:8px;font-size:12px;color:#555;position:sticky;top:0;}
.bmt td{padding:8px;border-top:1px solid #f0f0f5;vertical-align:middle;}
.st-on{color:var(--ok);font-weight:700;font-size:12px;}.st-off{color:var(--text-muted);font-size:12px;}
.lk{border:none;background:none;color:#888;font-size:12px;text-decoration:underline;padding:2px 4px;}
@media (max-width:700px){.bb-dots,.bb-meta,.bb-btn:not(.m){display:none;}.bb{gap:6px;}.bm{padding:18px;}}

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function sstore(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null;}}
function apiUrl(){return store('m2_api')||DEFAULT_API_URL;}
function setApiUrl(){const v=prompt('파일럿 Apps Script 웹앱 주소 (…/exec)',apiUrl()||'');if(v===null)return;store('m2_api',v.trim()||null);}

// ── 서버 호출 (조회=GET, 저장=POST) ──────────────────────────────────
async function api(action,params,post){
  const url=apiUrl();
  if(!url)return{success:false,error:'서버 주소가 설정되지 않았습니다 (로그인 화면 하단 \'서버 주소 설정\')'};
  const p=Object.assign({token:S.token,role:S.role},(S.master||S.mgr)?{viewAs:S.viewAs}:{},params||{});
  try{
    const res=post
      ?await fetch(url,{method:'POST',body:JSON.stringify({action,params:p})})
      :await fetch(url+'?action='+encodeURIComponent(action)+'&params='+encodeURIComponent(JSON.stringify(p)));
    const j=await res.json();
    if(j&&j.expired&&!params?.__retry){const ok=await relogin();if(ok)return api(action,Object.assign({},params,{__retry:1}),post);logout(true);return j;}
    if(j&&j.celePending&&j.celePending.length)queueCele(j.celePending);
    return j;
  }catch(e){return{success:false,net:true,error:'서버 연결 실패'+(post?' · 입력한 내용은 보관돼 있으니 잠시 후 다시 저장하세요':'')+' ('+e.message+')'};}
}

function buildPick(){
  // 한 칸에서 바로: 본부(묶음 제목) → 팀(작은 제목) → 이름
  const ms=S.members||[],groups={};
  ms.forEach(n=>{const i=minf(n),h=hqLabel(i.hq),t=teamLabel(i.team);(groups[h]=groups[h]||{});(groups[h][t]=groups[h][t]||[]).push(n);});
  const hqOrd=(a,b)=>a==='테스트'?1:b==='테스트'?-1:a.localeCompare(b,'ko'),tNum=t=>{const m=/^(\d+)팀$/.exec(t);return m?+m[1]:999;};
  const vp=document.getElementById('viewPick');
  vp.innerHTML=Object.keys(groups).sort(hqOrd).map(h=>'<optgroup label="'+esc(h)+'">'+Object.keys(groups[h]).sort((a,b)=>tNum(a)-tNum(b)||a.localeCompare(b,'ko')).map(t=>
    (h==='테스트'?'':'<option disabled class="tgrp">'+esc(t)+'</option>')+groups[h][t].map(n=>'<option value="'+esc(n)+'"'+(n===S.viewAs?' selected':'')+'>\u3000'+esc(n)+'</option>').join('')).join('')+'</optgroup>').join('');

// ── 날짜 유틸 ─────────────────────────────────────────────────────
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function isYmd(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function addBizDays(s,n){const d=parseYmd(s);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++;}return ymd(d);}
function diffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
function fmtD(s){const d=parseYmd(s);if(!d)return s||'-';return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' ('+'일월화수목금토'[d.getDay()]+')';}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── 행 파생값: 예정/완료/누락 ─────────────────────────────────────────
function derive(r){
  const t=S.today;
  const valid=r.recalls.filter(x=>isYmd(x.date));
  const done=valid.filter(x=>x.memo);                                // 메모 있음 = 실제 통화 기록
  const plans=valid.filter(x=>!x.memo&&x.date>=t).sort((a,b)=>a.date.localeCompare(b.date)); // 오늘 이후 메모 없는 칸 = 예정
  const past=valid.filter(x=>x.date<=t).sort((a,b)=>a.date.localeCompare(b.date));
  const lastContact=past.length?past[past.length-1].date:(isYmd(r.firstCall)?r.firstCall:'');
  // 다음 재콜 = M열 재콜예정일 우선, 없으면 재콜칸의 미래 날짜(메모 없음)
  const next=isYmd(r.nextRecall)?r.nextRecall:(plans.length?plans[0].date:'');
  // 누락: 지난 날짜 중 가장 최근 칸이 메모 없이 남아있고(14일 이내), 앞으로 예정도 없음
  const lastPast=past.length?past[past.length-1]:null;
  // 놓침: 예정일이 지났고(30일 이내) 그 날 이후 재콜 기록이 없음
  const missed=(next&&next<t&&diffDays(next,t)<=30&&!past.some(x=>x.date>=next))?next:'';
  const inactive=INACTIVE_GRADES.includes(r.grade)||gradeGroup(r.grade)==='미분류';   // 빈칸·선택없음(미분류)도 진행 중 아님
  const monthStart=t.slice(0,8)+'01';
  const promoMissing=(isYmd(r.firstCall)&&r.firstCall>=monthStart&&PROMO_GRADES.includes(r.grade))
    ?[!r.budgetNum&&'예산',!r.advertiserManager&&'담당자명',!r.phone&&'직통연락처',!r.email&&'이메일'].filter(Boolean):[];
  // 평균 재콜 간격: 첫콜 → 재콜들(오늘까지) 날짜 사이 간격의 평균
  const flow=[...new Set([isYmd(r.firstCall)?r.firstCall:null].concat(past.map(x=>x.date)).filter(Boolean))].sort();
  const gaps=[];for(let i=1;i<flow.length;i++){const g=diffDays(flow[i-1],flow[i]);if(g>0)gaps.push(g);}
  const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:0;
  // 간격 경고: 진행 중 가망건, 앞으로 잡힌 재콜예정일이 없고, 마지막 컨택 후 경과일이 평균 간격보다 길 때
  const since=lastContact?diffDays(lastContact,t):0;
  // 경고는 가망건(단기·장기·권한오픈·권한+브리핑)에만 표시
  const gapWarn=(PROMO_GRADES.includes(r.grade)&&avgGap>0&&gaps.length>=1&&!(next&&next>=t)&&since>avgGap)?(since>=avgGap*2?'high':'mid'):'';
  const lastMemoObj=past.filter(x=>x.memo).slice(-1)[0]||null;
  return{done,plans,past,next,lastContact,missed,inactive,promoMissing,recallCnt:past.length,avgGap,flow,since,gapWarn,lastMemoObj};
}
function gradeKey(g){return g==='전체'?'all':(g==='권한+브리핑'?'권한브리핑':(['단기','장기','권한오픈','이관완료','메일전송','희망건','단순재콜'].includes(g)?g:'기타'));}
// 가망도 표시 순서 (선택없음·빈칸 = 미분류로 묶음)
const GRADE_ORDER=['이관완료','권한+브리핑','권한오픈','단기','장기','메일전송','희망건','단순재콜','미분류'];
function gradeGroup(g){return (!g||g==='선택없음')?'미분류':g;}
function gradeRank(g){const i=GRADE_ORDER.indexOf(gradeGroup(g));return i<0?GRADE_ORDER.length-1:i;}
function gradeBadge(g){const k=g==='권한+브리핑'?'권한브리핑':(['단기','장기','권한오픈','이관완료','메일전송','희망건','단순재콜'].includes(g)?g:'기타');return '<span class="badge g-'+k+'">'+esc(gradeGroup(g))+'</span>';}

  document.getElementById('admList').innerHTML='<table class="list adm-t"><thead><tr><th style="width:34px"></th><th style="width:120px">그룹</th><th>고객ID</th><th>업체명</th><th>URL</th><th style="width:300px"></th></tr></thead><tbody>'+

async function admPersist(msg){const r=await api('adSave',{items:ADM.items,groups:[1,2,3,4,5].map(admG)},true);if(!r.success){toast('저장 실패: '+(r.error||''),2500);return;}ADM.items=r.items;ADM.groups=r.groups||ADM.groups;renderAdm();if(msg)toast(msg,1400);}

  const l=ADM.memoList;
  return '<div class="adm-mh"><b>📝 '+esc(x.name||x.id)+' 메모</b><span class="hint">Ctrl+Enter로 저장 · 나만 보임</span><button class="lk" style="margin-left:auto" onclick="admToggleMemo(\'\')">닫기 ✕</button></div>'+
    '<div class="adm-mi"><textarea class="inp" id="admMemoIn" rows="2" maxlength="1000" placeholder="예: 10/20 예산 증액 협의, 담당자 휴가 ~10/25" onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))admMemoAdd()"></textarea><button class="btn primary" onclick="admMemoAdd()">메모 추가</button></div>'+

}
async function admToggleMemo(k){
  if(!k||ADM.open===k){ADM.open='';ADM.memoList=null;renderAdm();return;}
  ADM.open=k;ADM.memoList=null;renderAdm();
  const r=await api('adMemo',{k});if(ADM.open!==k)return;
  ADM.memoList=r.success?r.list:[];renderAdm();const t=document.getElementById('admMemoIn');if(t)t.focus();
}
function admMemoSync(k,list){ADM.memoList=list;if(list.length)ADM.memos[k]={n:list.length,last:{d:list[0].d,t:list[0].t.slice(0,80)}};else delete ADM.memos[k];renderAdm();}
async function admMemoAdd(){
  const k=ADM.open,el=document.getElementById('admMemoIn'),t=(el&&el.value||'').trim();if(!k||!t)return;
  el.disabled=true;const r=await api('adMemoAdd',{k,t},true);
  if(!r.success){el.disabled=false;toast(r.error||'저장 실패',2000);return;}
  const e2=document.getElementById('admMemoIn');if(e2){e2.value='';e2.disabled=false;}
  admMemoSync(k,r.list);toast('메모 저장됨',1200);const n=document.getElementById('admMemoIn');if(n)n.focus();
}
async function admMemoDel(id){if(!confirm('이 메모를 삭제할까요?'))return;const k=ADM.open;const r=await api('adMemoDel',{id,k},true);if(!r.success){toast(r.error||'삭제 실패',2000);return;}admMemoSync(k,r.list);}
function admSetG(i,g){ADM.items[i].g=+g||0;admPersist(g>0?'★ '+admG(+g)+'에 넣음':'그룹에서 뺌');}
function admRename(g){const v=prompt('그룹 '+g+' 이름 (20자 이내)',admG(g));if(v===null)return;ADM.groups=[1,2,3,4,5].map(k=>k===g?v.trim().slice(0,20):admG(k));admPersist('이름 변경됨');}
function admAdd(){
  const g=k=>document.getElementById(k).value.trim(),it={id:g('admId'),name:g('admName'),url:g('admUrl'),g:+g('admG')||0,own:document.getElementById('admOwn').checked};
  if(!it.id&&!it.name){toast('고객ID나 업체명을 입력하세요',1500);return;}
  if(ADM.edit>=0){ADM.items[ADM.edit]=it;ADM.edit=-1;}
  else{if(it.id&&ADM.items.some(x=>x.id===it.id)&&!confirm('같은 고객ID가 이미 있음. 그래도 추가할까요?'))return;ADM.items.unshift(it);}
  admCancel();admPersist('저장됨');
}
function admEdit(i){const x=ADM.items[i];ADM.edit=i;document.getElementById('admId').value=x.id;document.getElementById('admName').value=x.name;document.getElementById('admUrl').value=x.url;document.getElementById('admOwn').checked=!!x.own;
  document.getElementById('admAddBtn').textContent='수정 저장';document.getElementById('admCancel').classList.remove('hidden');renderAdm();document.getElementById('admName').focus();}
function admCancel(){ADM.edit=-1;['admId','admName','admUrl'].forEach(k=>document.getElementById(k).value='');document.getElementById('admOwn').checked=false;document.getElementById('admAddBtn').textContent='추가';document.getElementById('admCancel').classList.add('hidden');renderAdm();}
function admDel(i){if(!confirm('「'+(ADM.items[i].name||ADM.items[i].id)+'」 삭제할까요?'))return;ADM.items.splice(i,1);if(ADM.edit===i)admCancel();admPersist('삭제됨');}
function admMove(i,d){const j=i+d;if(j<0||j>=ADM.items.length)return;const t=ADM.items[i];ADM.items[i]=ADM.items[j];ADM.items[j]=t;renderAdm();clearTimeout(admMove._t);admMove._t=setTimeout(()=>admPersist(),800);}
let ADM_DRAG=-1;
function admDrag(e,i){ADM_DRAG=i;e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging');}
function admOver(e){if(ADM_DRAG<0)return;e.preventDefault();}
function admDrop(e,i){e.preventDefault();if(ADM_DRAG<0||ADM_DRAG===i)return;const it=ADM.items.splice(ADM_DRAG,1)[0];ADM.items.splice(i,0,it);ADM_DRAG=-1;renderAdm();admPersist('순서 저장됨');}
function admEnd(){ADM_DRAG=-1;document.querySelectorAll('.adm-t tr.dragging').forEach(t=>t.classList.remove('dragging'));}

function ppKey(){return 'm2_pp_'+S.role+'_'+(S.viewAs||'')+'_'+S.today;}

    else if(d.gapWarn&&!recToday)overdue.push(r);   // 평소 간격 초과 (가망건만, 위 목록과 중복 제외)

  const simpleSec='<details class="sec simple-sec"'+(S.simpleOpen!==false?' open':'')+' ontoggle="S.simpleOpen=this.open"><summary class="sec-h"><h3>단순재콜</h3><span class="n">'+simple.length+'건</span><span class="desc">오늘 예정 · 진행률 집계에서 제외 · 눌러서 접기/펼치기</span></summary>'+list(simple)+'</details>';

function dbQuick(k){
  const t=S.today,d=parseYmd(t);let from='',to='';
  if(k==='today'){from=to=t;}
  else if(k==='week'){from=mondayOf(t);to=t;}
  else if(k==='month'){from=t.slice(0,8)+'01';to=t;}
  else if(k==='prev'){const p=new Date(d.getFullYear(),d.getMonth()-1,1),e=new Date(d.getFullYear(),d.getMonth(),0);from=ymd(p);to=ymd(e);}
  else if(k==='30'){from=addDays(t,-29);to=t;}
  S.dbDate.from=from;S.dbDate.to=to;
  document.getElementById('dbFrom').value=from;document.getElementById('dbTo').value=to;dbQuickSync();renderDb();
}
function dbQuickSync(){
  const t=S.today,d=parseYmd(t),f=S.dbDate.from,e=S.dbDate.to;let k='';
  if(!f&&!e)k='all';else if(f===t&&e===t)k='today';else if(f===mondayOf(t)&&e===t)k='week';else if(f===t.slice(0,8)+'01'&&e===t)k='month';
  else if(f===ymd(new Date(d.getFullYear(),d.getMonth()-1,1))&&e===ymd(new Date(d.getFullYear(),d.getMonth(),0)))k='prev';else if(f===addDays(t,-29)&&e===t)k='30';
  document.querySelectorAll('#dbQuick .fchip').forEach(b=>b.classList.toggle('on',b.dataset.q===k));
}

function renderDb(){
  const present=new Set(S.rows.map(r=>gradeGroup(r.grade)));

  const df=S.dbDate,dateOf=r=>df.field==='last'?derive(r).lastContact:(isYmd(r.firstCall)?r.firstCall:'');
  const base=S.rows.filter(r=>{
    if(q&&![r.company,r.phone,r.keyword,r.advertiserManager].join(' ').toLowerCase().includes(q))return false;
    if(df.from||df.to){const dt=dateOf(r);if(!dt)return false;if(df.from&&dt<df.from)return false;if(df.to&&dt>df.to)return false;}

// ── 이달의 성과 현황 (가망도 변경 기록 기반, 서버 p0.22 이상 · 2026.10 적용 시점부터 적립) ──
const PERF_GA=['단기','장기','권한오픈','권한+브리핑','이관완료'];
const PERF_CARDS=[['이관완료','🏆 이관완료',['이관완료'],'#263238'],['권한DB','🔑 권한DB',['권한오픈','권한+브리핑'],'#00695c'],['단기','단기',['단기'],'#1565c0'],['장기','장기',['장기'],'#4527a0']];
const PERF={cache:{},month:'',open:'',more:{},loading:false};
function ymAdd(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

async function loadPerf(force){
  const m=PERF.month||(PERF.month=(S.today||ymd(new Date())).slice(0,7));const k=((S.master||S.mgr)?S.viewAs:'')+'|'+m;
  if(PERF.cache[k]&&!force&&Date.now()-PERF.cache[k].t<60000){renderPerf();return;}
  PERF.loading=true;renderPerf();const r=await api('perf',{month:m});PERF.loading=false;
  if(r&&r.success)PERF.cache[k]=r;else PERF.cache[k]={error:(r&&r.error)||'불러오기 실패',log:[],passed:[],months:[]};PERF.cache[k].t=Date.now();
  renderPerf();
}
async function txEdit(id,cur){
  const v=prompt('실제 월예산 (만원)',cur||'');if(v===null)return;const n=parseInt(String(v).replace(/\D/g,''),10);

function perfBuild(r){
  // 업체 키: 예전 기록은 업체명, p0.29부터는 AR열 ID → 지금 업체(ID)로 합쳐서 봄
  const byKey={},rowsByKey={},rowsByCo={};S.rows.forEach(x=>{rowsByKey[x.id]=x;rowsByCo[String(x.company||'').replace(/\s/g,'')]=x;});
  const canon=k=>rowsByKey[k]?k:(rowsByCo[k]?rowsByCo[k].id:k),passed=(r.passed||[]).map(canon);
  (r.log||[]).slice().sort((a,b)=>a.at<b.at?-1:1).forEach(e=>{const k=canon(e.key);(byKey[k]=byKey[k]||[]).push(e);});
  const cards={};PERF_CARDS.forEach(c=>cards[c[0]]=[]);let other=0;
  Object.keys(byKey).forEach(k=>{
    const es=byKey[k],row=rowsByKey[k],cur=row?gradeGroup(row.grade):es[es.length-1].to;
    const touched=es.some(e=>PERF_GA.includes(e.to)||PERF_GA.includes(e.from));if(!touched)return;
    const card=PERF_CARDS.find(c=>c[2].includes(cur));if(!card){other++;return;}
    if(card[0]==='이관완료'&&passed.includes(k))return;   // 이관 확인에서 '예전 건'으로 넘긴 업체 제외
    const fi=es.findIndex(e=>!PERF_GA.includes(e.from)&&PERF_GA.includes(e.to));
    let path,first=fi>=0;
    if(first){path=[es[fi].to].concat(es.slice(fi+1).map(e=>e.to));}else{path=[es[0].from].concat(es.map(e=>e.to));}
    path=path.filter((g,i)=>i===0||g!==path[i-1]);
    const startG=first?null:es[0].from,ri=g=>{const i=GRADE_ORDER.indexOf(g);return i<0?99:i;};
    const dir=startG&&PERF_GA.includes(startG)&&PERF_GA.includes(cur)?(ri(cur)<ri(startG)?'up':ri(cur)>ri(startG)?'down':''):'';
    cards[card[0]].push({key:k,row,company:row?row.company:es[es.length-1].company,cur,first,path,dir,at:es[es.length-1].at,firstAt:es[fi>=0?fi:0].at});
  });
  Object.values(cards).forEach(l=>l.sort((a,b)=>a.at<b.at?1:-1));
  // 확정 이관(NOTICE에 올라간 건)의 실제 월예산 — 업체별 합계
  const txBy={};let txSum=0,txMiss=0;(r.tx||[]).forEach(t=>{const k=canon(t.key)||canon(String(t.company||'').replace(/\s/g,''));(txBy[k]=txBy[k]||[]).push(t);txSum+=t.amount||0;if(!t.amount)txMiss++;});
  return {cards,other,txBy,txSum,txCnt:(r.tx||[]).length,txMiss};
}

  if(fold){const b0=r&&!r.error?perfBuild(r):null;el.innerHTML=h+(b0?'<div class="perf-mini">'+PERF_CARDS.map(c=>'<span style="color:'+c[3]+'">'+c[1]+' <b>'+b0.cards[c[0]].length+'</b></span>').join('')+'</div>':'')+'</div>';return;}

    const amtCell=x=>{if(!isTx)return '';const ts=b.txBy[x.key]||[];if(!ts.length)return '<td class="muted" title="이관 확인에서 오늘 이관으로 올리지 않은 건">-</td>';

      (l.length>10?'<div style="text-align:center;padding:8px"><button class="btn sm" onclick="PERF.more[\''+PERF.open+'\']=!PERF.more[\''+PERF.open+'\'];renderPerf()">'+(PERF.more[PERF.open]?'접기 ▲':'더보기 ▼ ('+(l.length-10)+'건 더)')+'</button></div>':'')

// ── 자주 쓰는 문구 (이 PC 브라우저에만 저장, 5칸, 신규등록 카드 안) ── 컨택포인트 등 반복 입력값을 눌러서 복사
const SNIP_N=5;
function snipKey(){return 'm2_snip_'+(S.role||'x');}
function loadSnips(){let a=[];try{a=JSON.parse(localStorage.getItem(snipKey())||'[]');}catch(e){}if(!Array.isArray(a))a=[];while(a.length<SNIP_N)a.push('');return a.slice(0,SNIP_N);}
function saveSnips(a){try{localStorage.setItem(snipKey(),JSON.stringify(a));return true;}catch(e){return false;}}
function renderSnips(){
  const el=document.getElementById('snipBox');if(!el)return;const a=loadSnips();

    (open?'':'')+'<div class="snips"'+(open?'':' style="display:none"')+'>'+a.map((v,i)=>'<div class="snip'+(v?' has':'')+'"><span class="snum">'+(i+1)+'</span><input class="inp" data-i="'+i+'" value="'+esc(v)+'" placeholder="'+(i===0?'예: 대표 직통':i===1?'예: 마케팅팀':'비어 있음')+'" oninput="snipInput(this)" onkeydown="if(event.key===\'Enter\')snipCopy('+i+')"><button class="btn sm scopy" title="복사" onclick="snipCopy('+i+')"'+(v?'':' disabled')+'>📋</button></div>').join('')+'</div></div>';
}
function snipToggle(){store('m2_snip_open',store('m2_snip_open')==='1'?null:'1');renderSnips();}
function snipInput(inp){
  const a=loadSnips(),i=+inp.dataset.i;a[i]=inp.value.trim();
  if(!saveSnips(a)){toast('이 브라우저에서는 저장할 수 없음 (시크릿 창 등)',2500);return;}
  const box=inp.parentElement;box.classList.toggle('has',!!a[i]);box.querySelector('.scopy').disabled=!a[i];
  const n=document.querySelector('.snip-sec .snip-h .n');if(n)n.textContent=a.filter(Boolean).length+'/'+SNIP_N;
}
function snipCopy(i){
  const v=loadSnips()[i];if(!v)return;
  const done=()=>toast('복사됨: '+(v.length>30?v.slice(0,30)+'…':v)+' → 원하는 칸에 Ctrl+V',1800);
  const fallback=()=>{const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){toast('복사 실패',1500);}t.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fallback);else fallback();
}

// ── 중복 확인 (본인 DB 안에서만): 업체명·URL·직통연락처 중 하나라도 겹치면 안내 + '이어서 기록' ──
function normCo(v){return String(v||'').toLowerCase().replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|\(사\)|사단법인/g,'').replace(/[\s.,·\-_'"]/g,'');}
const URL_FULL_PATH=/(^|\.)(smartstore\.naver\.com|blog\.naver\.com|m\.blog\.naver\.com|cafe\.naver\.com|instagram\.com|facebook\.com|youtube\.com|brand\.naver\.com|place\.naver\.com|map\.naver\.com|modoo\.at|tistory\.com|linktr\.ee)$/;
function normUrl(v){let u=String(v||'').trim().toLowerCase();if(!u)return '';u=u.replace(/^[a-z]+:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
  const host=u.split('/')[0];return URL_FULL_PATH.test(host)?u:host;}
function normPhone(v){const d=String(v||'').replace(/\D/g,'');return d.length>=8?d:'';}
function findDups(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const co=normCo(g('nCompany')),url=normUrl(g('nUrl')),ph=normPhone(g('nPhone'));
  if(!co&&!url&&!ph)return [];
  return S.rows.map(r=>{const why=[];
    if(co&&normCo(r.company)===co)why.push('업체명');
    if(url&&r.url&&normUrl(r.url)===url)why.push('URL');
    if(ph&&String(r.phone||'').split(/[\/,]/).some(x=>normPhone(x)===ph))why.push('번호');
    return why.length?{r,why}:null;}).filter(Boolean);
}
function dupCheck(){
  const el=document.getElementById('nDup');if(!el)return;const l=findDups();
  if(!l.length){el.innerHTML='';return;}
  el.innerHTML='<div class="dupbox"><div class="duph">⚠ 내 DB에 이미 있는 업체일 수 있음 · 같은 업체면 <b>이어서 기록</b>을 누르세요 (새 행 없이 기존 업체에 오늘 통화로 기록)</div>'+
    l.slice(0,5).map(({r,why})=>{const d=derive(r);return '<div class="dupr">'+gradeBadge(r.grade)+'<b>'+esc(r.company)+'</b>'+why.map(w=>'<span class="chip warn">'+w+' 일치</span>').join('')+

      '<span class="dupa"><button class="btn sm" onclick="openCard(\''+esc(r.id)+'\')">카드 보기</button><button class="btn sm primary" onclick="contAppend(\''+esc(r.id)+'\')">이어서 기록</button></span></div>';}).join('')+'</div>';
}
// 신규등록 폼 내용을 기존 업체에 이어서 기록: 첫콜내용 → 오늘 재콜 메모, 재콜예정일·가망도 반영, 기존에 비어 있던 칸만 채움
async function contAppend(id){
  const r=S.rows.find(x=>x.id===id);if(!r)return;
  const g=k=>(document.getElementById(k)||{}).value.trim();
  const memo=g('nContent'),next=g('nNext'),grade=g('nGrade');
  if(!memo){toast('G 첫콜내용 칸에 오늘 통화 내용을 적고 눌러주세요',2500);document.getElementById('nContent').focus();return;}
  if(!confirm('「'+r.company+'」에 이어서 기록할까요?\n· 오늘 재콜 메모: '+memo+(next?'\n· 재콜예정일: '+fmtD(next):'')+(grade&&grade!==r.grade?'\n· 가망도: '+(r.grade||'-')+' → '+grade:'')+'\n· 비어 있던 칸만 입력값으로 채움 (기존 값은 그대로)'))return;
  const fill={phone:g('nPhone'),url:g('nUrl'),budget:toManwon(g('nBudget'))||'',advertiserManager:g('nManager'),email:g('nEmail'),keyword:g('nKeyword'),rank:g('nRank'),contactPoint:g('nContactPoint')};
  const fields={},base={};Object.keys(fill).forEach(k=>{if(fill[k]&&!String(r[k]||'').trim()){fields[k]=fill[k];base[k]='';}});
  const params={id,memo,date:S.today};if(next)params.nextDate=next;if(grade&&grade!==r.grade)params.grade=grade;
  toast('기존 업체에 기록 중…');
  const res=await api('recall',params,true);
  if(!res.success){hideToast();alert(res.error||'저장 실패');return;}
  upsertRow(res.row);
  if(Object.keys(fields).length){const u=await api('update',{id,fields,base},true);if(u.success)upsertRow(u.row);else toast('메모는 기록됨 · 빈칸 채우기 실패: '+(u.error||''),3000);}
  hideToast();renderNew();renderToday();renderDb();openCard(id);
  undoBar('「'+r.company+'」에 이어서 기록함'+(Object.keys(fields).length?' · 빈칸 '+Object.keys(fields).length+'개 채움':''),res.undo);
}
async function saveNew(force){
  const g=id=>document.getElementById(id).value.trim();
  const data={company:g('nCompany'),phone:g('nPhone'),content:g('nContent'),grade:g('nGrade'),nextDate:g('nNext'),budget:toManwon(g('nBudget')),advertiserManager:g('nManager'),email:g('nEmail'),keyword:g('nKeyword'),rank:g('nRank'),url:g('nUrl'),contactPoint:g('nContactPoint')};
  const err=document.getElementById('nErr');
  const miss=[['grade','가망도'],['company','업체명'],['content','첫콜내용'],['phone','직통연락처']].filter(x=>!data[x[0]]).map(x=>x[1]);
  if(miss.length){err.textContent=miss.join(', ')+' 입력 필요';return;}
  const rec=[!data.budget&&'예산',!data.advertiserManager&&'담당자명',!data.email&&'이메일'].filter(Boolean);
  if(rec.length&&PROMO_GRADES.includes(data.grade)&&!force&&!confirm(rec.join(', ')+'이(가) 비어 있어 신규P로 인정되지 않음.\n그대로 등록할까요?'))return;
  const dups=findDups();
  if(!force&&dups.length){if(!confirm('내 DB에 비슷한 업체가 '+dups.length+'건 있음 ('+dups.slice(0,3).map(d=>d.r.company+': '+d.why.join('·')+' 일치').join(', ')+')\n\n다른 업체가 맞으면 [확인] → 새 행으로 등록\n같은 업체면 [취소] → 아래 목록에서 \'이어서 기록\'')){dupCheck();return;}force=true;}
  err.textContent='';const btn=document.getElementById('nSave');btn.disabled=true;toast('저장 중…');
  const r=await api('create',{data,force:!!force},true);
  btn.disabled=false;hideToast();
  if(!r.success){
    if(r.duplicate&&confirm(r.error+'\n같은 이름으로 그래도 등록할까요?'))return saveNew(true);
    err.textContent=r.error||'저장 실패';return;
  }
  clearDraft('new_',true);upsertRow(r.row);renderNew();renderToday();renderDb();toast('등록 완료 · 아래 오늘 신규DB에 추가됨',2200);
}

// ── 리포트: 신규 · 재콜 · 이관 전환을 일별(영업일)/주별/월별로 집계 ─────────
// 출처: 신규=B열 첫콜날짜, 재콜=재콜칸 날짜(메모 없어도 포함), 이관=가망도이력(없으면 마지막 재콜일→첫콜일로 대체)
const RPT_COLORS={new:'#2a78d6',recall:'#eb6834',transfer:'#1baf7a'};
const RPT_LABEL={new:'신규',recall:'재콜',transfer:'이관 전환'};
function rptEvents(){
  const t=S.today,ev=[];
  S.rows.forEach(r=>{
    if(isYmd(r.firstCall)&&r.firstCall<=t)ev.push({type:'new',date:r.firstCall,r});
    r.recalls.forEach(x=>{if(isYmd(x.date)&&x.date<=t)ev.push({type:'recall',date:x.date,r,memo:x.memo});});
  });
  // 이관: 업체별 가장 최근 '이관완료' 기록 1건
  const byCo={};S.rows.forEach(r=>{byCo[r.company]=r;});
  const tr={};(S.history||[]).forEach(h=>{if(h.to==='이관완료'&&byCo[h.company]&&h.date<=t&&(!tr[h.company]||h.date>tr[h.company]))tr[h.company]=h.date;});
  S.rows.forEach(r=>{
    if(r.grade!=='이관완료')return;
    let d=tr[r.company],est=false;
    if(!d){const past=r.recalls.filter(x=>isYmd(x.date)&&x.date<=t).map(x=>x.date).sort();d=past.length?past[past.length-1]:(isYmd(r.firstCall)?r.firstCall:'');est=true;}
    if(d)ev.push({type:'transfer',date:d,r,est});
  });
  return ev;
}
function mondayOf(s){const d=parseYmd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function rptBuckets(mode){
  const t=S.today,out=[];
  if(mode==='day'){let d=parseYmd(t);while(out.length<30){const w=d.getDay();if(w!==0&&w!==6){const k=ymd(d);out.unshift({key:k,label:(d.getMonth()+1)+'/'+d.getDate(),title:fmtD(k)});}d.setDate(d.getDate()-1);}}
  else if(mode==='week'){let m=parseYmd(mondayOf(t));for(let i=0;i<12;i++){const k=ymd(m),e=new Date(m);e.setDate(e.getDate()+4);out.unshift({key:k,label:(m.getMonth()+1)+'/'+m.getDate()+'주',title:fmtD(k)+' 시작 주 (주말 기록 포함)'});m.setDate(m.getDate()-7);}}
  else{const d=parseYmd(t);d.setDate(1);for(let i=0;i<12;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');out.unshift({key:k,label:String(d.getFullYear()).slice(2)+'.'+(d.getMonth()+1),title:d.getFullYear()+'년 '+(d.getMonth()+1)+'월'});d.setMonth(d.getMonth()-1);}}
  return out;
}
function rptKey(date,mode){if(mode==='day'){const w=parseYmd(date).getDay();return (w===0||w===6)?null:date;}if(mode==='week')return mondayOf(date);return date.slice(0,7);}
function rptAggregate(mode){
  const bs=rptBuckets(mode),idx={};bs.forEach((b,i)=>{idx[b.key]=i;b.new=[];b.recall=[];b.transfer=[];});
  rptEvents().forEach(e=>{const k=rptKey(e.date,mode);if(k!==null&&idx[k]!==undefined)bs[idx[k]][e.type].push(e);});
  return bs;
}
// 막대그래프 (SVG 직접 그림): 같은 단위(건수) → 축 하나, 그룹 막대
function rptChart(id,bs,types){
  const W=Math.max(560,(document.getElementById('tabReport').clientWidth||1200)-30),H=240,padL=36,padR=8,padT=16,padB=30,iw=W-padL-padR,ih=H-padT-padB;
  const max=Math.max(1,...bs.map(b=>Math.max(...types.map(tp=>b[tp].length))));
  const step=max<=5?1:Math.ceil(max/4/5)*5||1,top=Math.ceil(max/step)*step,ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  const gw=iw/bs.length,gap=2,bw=Math.max(2,Math.min(22,(gw*0.72-gap*(types.length-1))/types.length));
  const y=v=>padT+ih-(v/top)*ih;
  const every=Math.ceil(bs.length/15);
  let g='';
  ticks.forEach(v=>{g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#e8eaf0" stroke-width="1"/><text x="'+(padL-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#8a8f9c">'+v+'</text>';});
  bs.forEach((b,i)=>{
    const gx=padL+gw*i+(gw-(bw*types.length+gap*(types.length-1)))/2;
    types.forEach((tp,j)=>{const v=b[tp].length;if(!v)return;const x=gx+j*(bw+gap),yy=y(v),h=padT+ih-yy,r=Math.min(4,bw/2,h);
      g+='<path d="M'+x+','+(padT+ih)+'V'+(yy+r)+'Q'+x+','+yy+' '+(x+r)+','+yy+'H'+(x+bw-r)+'Q'+(x+bw)+','+yy+' '+(x+bw)+','+(yy+r)+'V'+(padT+ih)+'Z" fill="'+RPT_COLORS[tp]+'"/>';
      if(types.length===1)g+='<text x="'+(x+bw/2)+'" y="'+(yy-4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#555">'+v+'</text>';});
    if(i%every===0||i===bs.length-1)g+='<text x="'+(padL+gw*i+gw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="#8a8f9c">'+esc(b.label)+'</text>';
    g+='<rect class="hit" x="'+(padL+gw*i)+'" y="'+padT+'" width="'+gw+'" height="'+ih+'" fill="transparent" data-i="'+i+'"'+(S.rptSel===b.key?' style="fill:rgba(57,73,171,.08)"':'')+'/>';
  });
  g+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+ih)+'" y2="'+(padT+ih)+'" stroke="#c9cdd6" stroke-width="1"/>';
  return '<div class="rchart" id="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="max-width:100%;height:auto;display:block;">'+g+'</svg><div class="rtip hidden"></div></div>';
}
function rptBindHover(id,bs,types){
  const box=document.getElementById(id);if(!box)return;const tip=box.querySelector('.rtip');
  box.querySelectorAll('rect.hit').forEach(rc=>{
    rc.addEventListener('mousemove',ev=>{const b=bs[+rc.dataset.i];
      tip.innerHTML='<b>'+esc(b.title)+'</b>'+types.map(tp=>'<div><span class="rdot" style="background:'+RPT_COLORS[tp]+'"></span>'+RPT_LABEL[tp]+' <b>'+b[tp].length+'</b>건'+(tp==='recall'?' <span class="muted">('+new Set(b.recall.map(e=>e.r.id)).size+'개 업체)</span>':'')+'</div>').join('')+'<div class="muted" style="margin-top:3px;">클릭하면 업체 목록</div>';
      tip.classList.remove('hidden');const bx=box.getBoundingClientRect();let x=ev.clientX-bx.left+14;if(x>bx.width-200)x=ev.clientX-bx.left-200;tip.style.left=x+'px';tip.style.top=(ev.clientY-bx.top-10)+'px';});
    rc.addEventListener('mouseleave',()=>tip.classList.add('hidden'));
    rc.addEventListener('click',()=>{const b=bs[+rc.dataset.i];S.rptSel=S.rptSel===b.key?'':b.key;renderReport();});
  });
}
function renderReport(){

  const tile=(tp,label,v,pv,sub)=>{const d=v-pv;return '<div class="stat"><div class="l"><span class="rdot" style="background:'+RPT_COLORS[tp]+'"></span>'+label+'</div><div class="v">'+v+'</div><div class="hint">'+punit+' '+pv+' · '+(d>0?'<span style="color:#2e7d32">▲'+d+'</span>':d<0?'<span style="color:#c62828">▼'+(-d)+'</span>':'변동 없음')+(sub||'')+'</div></div>';};
  const coCnt=b=>new Set(b.recall.map(e=>e.r.id)).size;

    detail='<div class="sec"><div class="sec-h"><h3>'+esc(sel.title)+' 상세</h3><span class="desc"><a href="#" onclick="S.rptSel=\'\';renderReport();return false;">닫기</a></span></div>'+
      '<div class="rgrid"><div><div class="rsub"><span class="rdot" style="background:'+RPT_COLORS.new+'"></span>신규 '+sel.new.length+'건</div>'+list('new')+'</div>'+
      '<div><div class="rsub"><span class="rdot" style="background:'+RPT_COLORS.recall+'"></span>재콜 '+sel.recall.length+'건 ('+coCnt(sel)+'개 업체)</div>'+list('recall')+'</div>'+
      '<div><div class="rsub"><span class="rdot" style="background:'+RPT_COLORS.transfer+'"></span>이관 전환 '+sel.transfer.length+'건</div>'+list('transfer')+'</div></div></div>';
  }
  el.innerHTML=
    '<div class="toolbar">'+['day','week','month'].map(m=>'<button class="fchip'+(mode===m?' on':'')+'" onclick="S.rptMode=\''+m+'\';S.rptSel=\'\';renderReport()">'+{day:'일별 (영업일 30일)',week:'주별 (12주)',month:'월별 (12개월)'}[m]+'</button>').join('')+
    '<span class="hint" style="margin-left:auto;">신규=첫콜날짜 · 재콜=재콜칸 날짜 · 이관=가망도이력 기준</span></div>'+
    '<div class="stats">'+tile('new',unit+' 신규',cur.new.length,prev.new.length)+tile('recall',unit+' 재콜',cur.recall.length,prev.recall.length,' · '+coCnt(cur)+'개 업체')+tile('transfer',unit+' 이관 전환',cur.transfer.length,prev.transfer.length)+
      '<div class="stat"><div class="l">기간 합계 ('+bs.length+(mode==='day'?'영업일':mode==='week'?'주':'개월')+')</div><div class="v" style="font-size:16px;line-height:1.7;">신규 '+bs.reduce((n,b)=>n+b.new.length,0)+' · 재콜 '+bs.reduce((n,b)=>n+b.recall.length,0)+' · 이관 '+bs.reduce((n,b)=>n+b.transfer.length,0)+'</div></div></div>'+
    '<div class="sec"><div class="sec-h"><h3>신규 · 재콜</h3><span class="rlegend"><span><span class="rdot" style="background:'+RPT_COLORS.new+'"></span>신규</span><span><span class="rdot" style="background:'+RPT_COLORS.recall+'"></span>재콜</span></span><span class="desc">막대를 누르면 업체 목록</span></div><div style="padding:8px 14px 4px;">'+rptChart('rcA',bs,['new','recall'])+'</div></div>'+
    '<div class="sec"><div class="sec-h"><h3><span class="rdot" style="background:'+RPT_COLORS.transfer+'"></span>이관 전환</h3><span class="desc">가망도이력 기록이 없는 예전 건은 마지막 재콜일로 추정</span></div><div style="padding:8px 14px 4px;">'+rptChart('rcB',bs,['transfer'])+'</div></div>'+
    detail+cpStatHtml();

// ── 리포트: 컨택포인트(I열) 성과 — 적힌 그대로 나눠서 셈 (쉼표·슬래시·+ 등으로 구분, 띄어쓰기·대소문자만 같게 봄) ──
const CPS={per:'month',open:'',more:false};
const CP_GA=['단기','장기','권한오픈','권한+브리핑','이관완료'],CP_AUTH=['권한오픈','권한+브리핑'];
function cpTokens(v){const t=String(v||'').split(/[,\/+·|;\n]|\s및\s|&/).map(x=>x.trim()).filter(Boolean);return t.length?t:['(미기재)'];}
function cpStatHtml(){

  const rng={month:[ym+'-01',t],prev:[ymAdd(ym,-1)+'-01',ymAdd(ym,-1)+'-31'],m3:[ymAdd(ym,-2)+'-01',t],all:['0000',t]}[CPS.per];
  const rows=S.rows.filter(r=>isYmd(r.firstCall)&&r.firstCall>=rng[0]&&r.firstCall<=rng[1]);
  const pre=((S.master||S.mgr)?S.viewAs:'')+'|',amt={};Object.keys(PERF.cache||{}).forEach(k=>{if(k.indexOf(pre)===0)(PERF.cache[k].tx||[]).forEach(t=>{const a=+t.amount||0;if(t.key)amt['i'+t.key]=a;if(t.company)amt['c'+String(t.company).replace(/\s/g,'')]=a;});});
  const amtOf=r=>amt['i'+r.id]||amt['c'+String(r.company||'').replace(/\s/g,'')]||0;
  const g={};
  rows.forEach(r=>{const seen={};cpTokens(r.contactPoint).forEach(tok=>{const k=tok==='(미기재)'?'~':tok.toLowerCase().replace(/\s+/g,'');if(seen[k])return;seen[k]=1;
    const o=g[k]=g[k]||{k,labels:{},rows:[],ga:0,auth:0,tx:0};o.labels[tok]=(o.labels[tok]||0)+1;o.rows.push(r);
    const gg=gradeGroup(r.grade);if(CP_GA.includes(gg))o.ga++;if(CP_AUTH.includes(gg))o.auth++;if(gg==='이관완료'){o.tx++;o.amt=(o.amt||0)+amtOf(r);}});});
  const list=Object.values(g).map(o=>{o.label=Object.entries(o.labels).sort((a,b)=>b[1]-a[1])[0][0];return o;}).sort((a,b)=>(a.k==='~')-(b.k==='~')||b.rows.length-a.rows.length);
  const max=Math.max(1,...list.map(o=>o.rows.length)),lim=CPS.more?list.length:12,pct=(n,d)=>d?Math.round(n/d*100):0;
  const per=[['month','이번 달'],['prev','지난달'],['m3','최근 3개월'],['all','전체']];
  let h='<div class="sec cps"><div class="sec-h"><h3>🎯 컨택포인트 성과</h3><span class="hint">'+rows.length+'개 업체 (첫콜 기준)</span><span style="margin-left:auto;display:flex;gap:4px">'+per.map(([k,l])=>'<button class="fchip'+(CPS.per===k?' on':'')+'" onclick="CPS.per=\''+k+'\';CPS.open=\'\';renderReport()">'+l+'</button>').join('')+'</span></div>';
  if(!list.length)return h+'<div class="empty">이 기간에 첫콜한 업체 없음</div></div>';
  h+='<table class="list cps-t"><thead><tr><th>컨택포인트 <span class="muted" style="font-weight:400">(I열 그대로)</span></th><th style="width:34%">업체 수</th><th>가망 <span class="muted" style="font-weight:400">단기↑</span></th><th>권한</th><th>이관</th></tr></thead><tbody>'+
    list.slice(0,lim).map(o=>{const n=o.rows.length,gp=pct(o.ga,n),hi=o.k!=='~'&&n>=3&&gp>=30,op=CPS.open===o.k;
      return '<tr class="r'+(op?' on':'')+'" onclick="CPS.open=CPS.open===\''+esc(o.k)+'\'?\'\':\''+esc(o.k)+'\';renderReport()"><td><b>'+esc(o.k==='~'?'(미기재)':o.label)+'</b>'+(Object.keys(o.labels).length>1?' <span class="muted" title="'+esc(Object.keys(o.labels).join(' / '))+'">외 표기 '+(Object.keys(o.labels).length-1)+'</span>':'')+'</td>'+
        '<td><div class="cps-bar"><i style="width:'+Math.max(4,Math.round(n/max*100))+'%;background:'+(hi?'#2e9d6a':o.k==='~'?'#c9ccd8':'#7986cb')+'"></i><span>'+n+'</span></div></td>'+
        '<td>'+(o.ga?o.ga+' <span class="cps-p'+(hi?' hi':'')+'">'+gp+'%</span>':'<span class="muted">0</span>')+'</td><td>'+(o.auth?o.auth+' <span class="cps-p">'+pct(o.auth,n)+'%</span>':'<span class="muted">0</span>')+'</td><td>'+(o.tx?'<b>'+o.tx+'건</b>'+(o.amt?' <span class="cps-p">'+fmtMan(o.amt)+'</span>':''):'<span class="muted">0</span>')+'</td></tr>'+

    '</tbody></table>'+(list.length>12?'<div style="text-align:center;padding:8px"><button class="btn sm" onclick="CPS.more=!CPS.more;renderReport()">'+(CPS.more?'접기 ▲':'나머지 '+(list.length-12)+'개 더보기 ▼')+'</button></div>':'')+

// 가망도 변경 기록 (서버 가망도변경로그 + 운영 가망도이력) — 카드 열 때 한 번 불러와 둠
async function loadCardLog(r){
  if(CARD.log[r.id]||CARD.logBusy[r.id])return;CARD.logBusy[r.id]=1;
  const res=await api('cardLog',{id:r.id,company:r.company});CARD.logBusy[r.id]=0;
  CARD.log[r.id]=(res&&res.success)?res.items||[]:[];CARD.mv=CARD.mv||{};CARD.mv[r.id]=(res&&res.success)?res.moves||[]:[];
  if(S.openId===r.id)histRender();
}
function histRender(){
  const el=document.getElementById('hList'),sm=document.getElementById('hSum');if(!el)return;
  const r=S.rows.find(x=>x.id===S.openId);if(!r)return;const t=S.today,d=derive(r);
  document.querySelectorAll('.hflt button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(CARD.hf==='all')));
  const ev=[];
  r.recalls.filter(x=>isYmd(x.date)).forEach(x=>{
    if(x.memo)ev.push({k:/^부재/.test(x.memo)?'abs':'call',date:x.date,memo:x.memo});
    else ev.push({k:x.date>=t?'plan':'nomemo',date:x.date});
  });
  if(isYmd(r.nextRecall)&&!ev.some(e=>e.k==='plan'&&e.date===r.nextRecall))ev.push({k:r.nextRecall>=t?'plan':'over',date:r.nextRecall});
  // 가망도 변경: 서버 기록 + 운영 가망도이력(같은 날 같은 변경은 하나로)
  const seen={},nc=String(r.company||'').replace(/\s/g,'');
  (CARD.log[r.id]||[]).forEach(g=>{const dt=String(g.at).slice(0,10);const k=dt+'|'+g.to;if(seen[k])return;seen[k]=1;ev.push({k:'grade',date:dt,at:g.at,from:g.from,to:g.to});});
  (S.history||[]).filter(h=>String(h.company||'').replace(/\s/g,'')===nc).forEach(h=>{const k=h.date+'|'+h.to;if(seen[k])return;seen[k]=1;ev.push({k:'grade',date:h.date,from:h.from,to:h.to});});
  ((CARD.mv||{})[r.id]||[]).forEach(m=>ev.push({k:'mv',date:String(m.at).slice(0,10),at:m.at,from:m.from,to:m.to}));
  const first=isYmd(r.firstCall)?{k:'first',date:r.firstCall,memo:r.content}:null;
  // 시간순으로 간격·통화 순번 계산 후 최신이 위로
  const ord={first:0,grade:1,call:2,abs:2,nomemo:2,mv:3,over:3,plan:4};
  const all=(first?[first]:[]).concat(ev).sort((a,b)=>a.date.localeCompare(b.date)||(ord[a.k]-ord[b.k])||String(a.at||'').localeCompare(String(b.at||'')));
  let prev='',nCall=0;all.forEach(e=>{if(['first','call','abs','nomemo'].includes(e.k)){if(prev&&e.k!=='first')e.gap=diffDays(prev,e.date);prev=e.date;}if(e.k==='call')e.n=++nCall;});
  const calls=all.filter(e=>e.k==='call').length,abs=all.filter(e=>e.k==='abs').length;
  const mvN=all.filter(e=>e.k==='mv').length;
  sm.textContent='통화 '+calls+(abs?' · 부재 '+abs:'')+(mvN?' · 미룸 '+mvN:'')+(first?' · 첫콜 '+tsMD(r.firstCall):'');
  // 첫콜은 맨 위에 따로 고정, 그 아래는 최신순
  let list=all.filter(e=>e.k!=='first').reverse();if(CARD.hf==='call')list=list.filter(e=>e.k==='call');
  const lim=CARD.more?list.length:10;
  const ago=dt=>{const n=diffDays(dt,t);return n===0?'오늘':n>0?n+'일 전':(-n)+'일 후';};
  const ri=g=>{const i=GRADE_ORDER.indexOf(gradeGroup(g));return i<0?99:i;};
  const pin=first?'<div class="h-first"><div class="hf-h">📌 첫콜 <b>'+fmtD(first.date)+'</b><span class="g">'+ago(first.date)+(calls?' · 이후 통화 '+calls+'회':'')+'</span></div>'+(first.memo?'<div class="hf-m">'+esc(first.memo)+'</div>':'')+'</div>':'';
  el.innerHTML=pin+(list.length?list.slice(0,lim).map((e,i)=>{
    const meta=(e.gap!==undefined?(e.gap?'+'+e.gap+'일':'같은 날'):'')+(e.n?(e.gap!==undefined?' · ':'')+e.n+'번째 통화':'');
    const when='<span class="g">'+[meta,i<3||e.k==='plan'||e.k==='over'?ago(e.date):''].filter(Boolean).join(' · ')+'</span>';
    if(e.k==='first')return '<div class="hi first"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+' <span class="c">첫콜</span>'+when+'</div>'+(e.memo?'<div class="m">'+esc(e.memo)+'</div>':'')+'</div></div>';
    if(e.k==='call')return '<div class="hi"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+' 통화 '+when+'</div><div class="m">'+esc(e.memo)+'</div></div></div>';
    if(e.k==='mv')return '<div class="hi mv"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+(e.at&&String(e.at).length>10?' '+String(e.at).slice(11,16):'')+' <span class="c">📅 미룸</span> <span class="mvt">'+(isYmd(e.from)?tsMD(e.from):'없음')+' → '+(e.to?'<b>'+tsMD(e.to)+'</b>':'재콜 없음')+'</span>'+when+'</div></div></div>';
    if(e.k==='abs')return '<div class="hi abs"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+' <span class="c">부재</span>'+when+'</div></div></div>';
    if(e.k==='nomemo')return '<div class="hi nomemo"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+' <span class="c">메모 없음</span>'+when+'</div></div></div>';
    if(e.k==='plan')return '<div class="hi plan"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+' <span class="c">재콜 예정</span>'+when+'</div></div></div>';
    if(e.k==='over')return '<div class="hi miss"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+' <span class="c">예정일 지남</span>'+when+'</div></div></div>';
    const up=ri(e.to)<ri(e.from),dn=ri(e.to)>ri(e.from);
    return '<div class="hi gc"><span class="dot"></span><div><div class="d">'+fmtD(e.date)+(e.at&&String(e.at).length>10?' '+String(e.at).slice(11,16):'')+' <span class="g">가망도 변경</span></div><div class="gm">'+esc(e.from||'-')+' → '+esc(e.to)+(up?' <span class="perf-up">▲</span>':dn?' <span class="perf-down">▼</span>':'')+'</div></div></div>';
  }).join('')+(list.length>10?'<div class="hmore"><button class="btn sm" onclick="CARD.more=!CARD.more;histRender()">'+(CARD.more?'접기 ▲':'이전 기록 '+(list.length-10)+'건 더보기 ▼')+'</button></div>':''):'<div class="hint">'+(first?'첫콜 이후 기록 없음':'기록 없음')+'</div>');
}

// 예산: 만원 단위 숫자만 입력 → 시트엔 '300만원' 형태로 저장
function toManwon(v){v=String(v||'').trim();if(!v)return '';const m=v.replace(/,/g,'').match(/^(\d+(?:\.\d+)?)\s*(만원|만)?$/);return m?Number(m[1]).toLocaleString('ko-KR')+'만원':null;}
// 시트 예산 → 만원 단위 숫자 (예전 원 단위 '4000000' → 400, '300만원' → 300, '1억2000만' → 12000, 1만 미만 숫자는 만원으로 봄)
function budgetMan(v){const t=String(v||'').replace(/[,\s]/g,'');if(!t)return null;let m=t.match(/^(\d+(?:\.\d+)?)(만원|만)?$/);
  if(m){const n=+m[1];return m[2]?n:(n>=10000?n/10000:n);}
  m=t.match(/^(\d+(?:\.\d+)?)억(?:(\d+)(?:만원|만)?)?원?$/);if(m)return +m[1]*10000+(+m[2]||0);return null;}
function fmtBudget(v){const n=budgetMan(v);if(n===null)return String(v||'');
  if(n>=10000){const e=Math.floor(n/10000),r=Math.round(n%10000);return e+'억'+(r?' '+r.toLocaleString('ko-KR')+'만원':'원');}
  return (Math.round(n*10)/10).toLocaleString('ko-KR')+'만원';}
function budgetInp(attr,val){const man=budgetMan(val);const v=man!==null?String(Math.round(man*10)/10):(val||'');return '<span class="uwrap"><input '+attr+' class="inp" type="text" inputmode="numeric" placeholder="300" value="'+esc(v)+'" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"><span class="u">만원</span></span>';}
const EDIT_FIELDS_BASE=[['company','업체명'],['phone','직통연락처'],['budget','예산'],['advertiserManager','담당자명'],['email','이메일'],['keyword','키워드'],['rank','순위'],['url','URL'],['contactPoint','컨택포인트'],['content','첫콜 내용','textarea']];

// ── 시작 ──────────────────────────────────────────────────────────
// 시작은 스크립트 맨 끝에서 (아래 선언들이 다 끝난 뒤 실행되도록)
function init(){
  const sso=(location.hash.match(/^#sso=([^&]+)/)||[])[1];
  if(sso){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}ssoLogin(decodeURIComponent(sso));return;}
  let sess=null;try{sess=JSON.parse(sstore('m2_sess')||'null');}catch(e){}
  if(sess&&sess.ver!==APP_VER){sess=null;sstore('m2_sess',null);}
  if(sess&&sess.token){S.token=sess.token;S.role=sess.role;S.name=sess.name;S.master=!!sess.master;S.mgr=!!sess.mgr;S.members=sess.members||[];S.minfo=sess.minfo||{};S.viewAs=urlView()||sess.viewAs||S.members[0]||'';enterApp(sess.testMode);}
  else if((()=>{try{return localStorage.getItem('m2_rtk');}catch(e){return null;}})())resumeLogin();
  else if(AUTO_LOGIN){document.getElementById('lgRole').value=AUTO_LOGIN.role;document.getElementById('lgPw').value=AUTO_LOGIN.password;document.getElementById('loginView').classList.remove('hidden');doLogin();}
  else showLogin();
}
function showLogin(){document.getElementById('loginView').classList.remove('hidden');try{const id=localStorage.getItem('m2_id');if(id){document.getElementById('lgRole').value=id;document.getElementById('lgSaveId').checked=true;document.getElementById('lgPw').focus();}else document.getElementById('lgRole').focus();}catch(e){}}
// 부서장 대시보드 🖥로 넘어옴: 그 로그인 그대로 보기 전용 접속 (실패하면 로그인 화면)
async function ssoLogin(s){
  const i=s.indexOf('~'),role=s.slice(0,i),token=s.slice(i+1);
  let sess=null;try{sess=JSON.parse(sstore('m2_sess')||'null');}catch(e){}
  if(sess&&sess.token&&sess.ver===APP_VER&&sess.role==='sso_'+role){S.token=sess.token;S.role=sess.role;S.name=sess.name;S.mgr=true;S.members=sess.members||[];S.minfo=sess.minfo||{};S.viewAs=urlView()||sess.viewAs||S.members[0]||'';enterApp(false);return;}
  const ov=document.getElementById('ldOv');document.getElementById('ldQ').textContent='';document.getElementById('ldSrc').textContent='';document.getElementById('ldT').textContent='부서장 대시보드 계정으로 접속 중…';ov.classList.remove('hidden');
  const r=await api('sso',{role,token},true);ov.classList.add('hidden');
  if(!r||!r.success){showLogin();document.getElementById('lgErr').textContent=(r&&r.error)||'접속 실패';return;}
  loginOk(r);
}
// 로그인 유지키로 바로 접속 (실패하면 로그인 화면)
async function resumeLogin(){
  let k=null;try{k=localStorage.getItem('m2_rtk');}catch(e){}
  if(!k){showLogin();return false;}
  const ov=document.getElementById('ldOv');document.getElementById('ldQ').textContent='';document.getElementById('ldSrc').textContent='';document.getElementById('ldT').textContent='자동 로그인 중…';ov.classList.remove('hidden');
  let r;try{const res=await fetch(apiUrl(),{method:'POST',body:JSON.stringify({action:'resume',params:{rtk:k}})});r=await res.json();}catch(e){r={success:false,error:'서버 연결 실패'};}
  ov.classList.add('hidden');
  if(!r||!r.success){if(r&&r.gone){try{localStorage.removeItem('m2_rtk');}catch(e){}}showLogin();if(r&&r.error)document.getElementById('lgErr').textContent=r.error;return false;}
  loginOk(r);return true;

function todayQuote(){
  const d=parseYmd(S.today)||new Date();const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),dow=d.getDay();
  let pool=QUOTES;
  if(dow===1)pool=QUOTES.filter(q=>q[2]==='go');
  else if(dow===5)pool=QUOTES.filter(q=>q[2]==='fun'||q[2]==='mind');
  else if(n%3===2)return {id:'quote',kind:'명언',title:WORK_LINES[Math.floor(n/3)%WORK_LINES.length],src:''};
  const q=pool[(n*37)%pool.length];return {id:'quote',kind:'명언',title:q[0],src:q[1]};
}

// 큰 캡처는 가로 1600px로 줄이고, PNG가 크면 JPEG로
function sgCompress(file){return new Promise(ok=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  let w=im.naturalWidth,h=im.naturalHeight;const M=1600;if(w>M){h=Math.round(h*M/w);w=M;}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  let d=c.toDataURL('image/png'),q=.85;if(d.length>900000){d=c.toDataURL('image/jpeg',q);while(d.length>900000&&q>.45){q-=.15;d=c.toDataURL('image/jpeg',q);}}

async function loadCoupon(){
  clearTimeout(CP.timer);if(!S.token){CP.timer=null;return;}
  const r=await api('coupon',{});
  if(r&&r.success){
    CP.off=tsMs(r.now)-Date.now();CP.active=r.active||[];
    CP.items=CP.active.filter(c=>!(c.type!=='raffle'&&c.won)).map(c=>Object.assign({kind:'쿠폰live'},c));

function mgrState(it){const n=BB.mgrNow||'';

  if(it.status==='취소')return['<span class="st-off">이관 취소됨</span>',''];
  if(it.status==='패스')return['<span class="st-off">예전 건 (게시 안 함)</span>',''];
  if(it.status==='확인대기')return it.end<=n?['<span class="st-off">확인 만료</span>','']:['<span class="st-on" style="color:var(--warn)">본인 확인 대기</span>','confirm'];
  if(it.start>n)return['<span class="st-on" style="color:var(--primary)">예약</span>','hide'];
  if(it.end<=n)return['<span class="st-off">종료</span>',it.kind==='공지'?'show':''];

const RL={p:null,res:null};
function relogin(){
  if(AUTO_LOGIN)return Promise.resolve(false);
  if(RL.p)return RL.p;
  RL.p=(async()=>{
    // 로그인 유지 중이면 창 없이 바로 새 세션
    let k=null;try{k=localStorage.getItem('m2_rtk');}catch(e){}
    if(k){try{const res=await fetch(apiUrl(),{method:'POST',body:JSON.stringify({action:'resume',params:{rtk:k}})});const r=await res.json();
      if(r&&r.success){S.token=r.token;try{const ss=JSON.parse(sstore('m2_sess')||'{}');ss.token=r.token;sstore('m2_sess',JSON.stringify(ss));}catch(e){}return true;}
      if(r&&r.gone)localStorage.removeItem('m2_rtk');}catch(e){}}
    return await new Promise(res=>{RL.res=res;
      document.getElementById('rlWho').textContent='계정: '+S.role+' ('+S.name+')';
      document.getElementById('rlErr').textContent='';document.getElementById('rlPw').value='';
      document.getElementById('rlOv').classList.remove('hidden');setTimeout(()=>document.getElementById('rlPw').focus(),50);});
  })();
  const p=RL.p;p.then(()=>{if(RL.p===p)RL.p=null;});
  return p;
}
function rlDone(ok){document.getElementById('rlOv').classList.add('hidden');const r=RL.res;RL.res=null;if(r)r(ok);}
async function rlOk(){
  const pw=document.getElementById('rlPw').value;if(!pw){document.getElementById('rlPw').focus();return;}
  const b=document.getElementById('rlBtn');b.disabled=true;
  let r;try{const res=await fetch(apiUrl(),{method:'POST',body:JSON.stringify({action:'auth',params:{role:S.role,password:pw}})});r=await res.json();}catch(e){r={success:false,error:'서버 연결 실패'};}
  b.disabled=false;
  if(!r.success){document.getElementById('rlErr').textContent=r.error||'로그인 실패';return;}
  S.token=r.token;
  try{const ss=JSON.parse(sstore('m2_sess')||'{}');ss.token=r.token;sstore('m2_sess',JSON.stringify(ss));}catch(e){}
  rlDone(true);toast('다시 로그인됨 · 이어서 저장 중',1800);
}

function draftStoreKey(k){return 'm2d_'+(S.name||'')+'_'+k;}
function saveDraftEl(el){const k=draftKey(el);if(!k)return;try{const v=el.value;if(v&&String(v).trim())localStorage.setItem(draftStoreKey(k),v);else localStorage.removeItem(draftStoreKey(k));}catch(e){}}
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))saveDraftEl(t);},true));
function restoreDrafts(root){
  if(!root)return;let n=0;
  root.querySelectorAll('input,textarea,select').forEach(el=>{const k=draftKey(el);if(!k||el.type==='file'||el.type==='checkbox')return;
    let v=null;try{v=localStorage.getItem(draftStoreKey(k));}catch(e){}
    if(v!==null&&!el.value){el.value=v;n++;if(el.id==='nCompany'&&typeof dupCheck==='function')dupCheck();}});
  if(n)toast('작성 중이던 내용을 불러왔음',1800);
}
function clearDraft(k,prefix){try{const base=draftStoreKey(k);if(!prefix){localStorage.removeItem(base);return;}Object.keys(localStorage).filter(x=>x.startsWith(base)).forEach(x=>localStorage.removeItem(x));}catch(e){}}

// ── 오늘 목표 (DB 작성수 = 오늘 신규등록 + 통화완료 + 부재 기록) ──
function writtenToday(){const t=S.today;let n=0;S.rows.forEach(r=>{if(r.firstCall===t)n++;r.recalls.forEach(x=>{if(x.date===t&&x.memo)n++;});});return n;}
// 오늘 목표: '오늘 처리' 카드 안의 작은 진행바 (v0.81)
function goalHtml(){
  if(S.mgr||!S.today)return '<div id="goalBar"></div>';
  const g=S.goal||0,n=writtenToday();
  if(!g)return '<div id="goalBar" class="goal-mini"><button class="gset" onclick="goalEdit()">🎯 오늘 목표 정하기</button></div>';
  const pct=Math.min(100,Math.round(n/g*100)),done=n>=g;
  return '<div id="goalBar" class="goal-mini'+(done?' done':'')+'" title="DB 작성수 = 신규등록 + 통화완료 + 부재"><span>🎯 DB 작성 <b>'+n+'</b>/'+g+(done?' 달성! 👏':'')+'</span><div class="gbar"><i style="width:'+pct+'%"></i></div><button class="gset" onclick="goalEdit()">변경</button></div>';
}
async function goalEdit(){
  const v=prompt('오늘 목표 DB 작성수 (신규등록 + 통화완료 + 부재 기록)\n한 번 정하면 매일 같은 목표로 유지됨. 0 = 끄기',S.goal||30);if(v===null)return;
  const n=parseInt(v,10);if(isNaN(n)||n<0){toast('숫자로 입력하세요',1500);return;}
  const r=await api('goalSet',{goal:n},true);if(!r||!r.success){toast((r&&r.error)||'저장 실패',2500);return;}
  S.goal=r.goal;const gb=document.getElementById('goalBar');if(gb)gb.outerHTML=goalHtml();toast('목표 저장',1200);
}

// ── 업체 코멘트 (부서장·관리자 ↔ 사원) ──
const CMT={items:[],inbox:[],busy:false};
async function loadCmt(){
  const r=await api('cmtList',{});if(!r||!r.success)return;
  CMT.items=r.items||[];CMT.inbox=r.inbox||[];cmtDot();if(S.openId)cmtRender();
}
function cmtDot(){bellDot();const n=CMT.inbox.length,b=document.getElementById('cmtBtn'),d=document.getElementById('cmtDot');if(!b)return;
  b.classList.toggle('hidden',!(n||S.master||S.mgr||CMT.items.length));d.textContent=n;d.classList.toggle('hidden',!n);
  b.title=S.master||S.mgr?(n?'사원 답글 '+n+'건':'코멘트 모아보기'):(n?'새 코멘트 '+n+'건':'코멘트 모아보기');}
function cmtRender(){
  const box=document.getElementById('cmtBox');if(!box)return;const r=S.rows.find(x=>x.id===S.openId);if(!r){box.innerHTML='';return;}
  const L=CMT.items.filter(c=>c.cid===r.id).sort((a,b)=>a.ts<b.ts?-1:1),viewer=S.master||S.mgr;
  if(!L.length&&!viewer){box.innerHTML='';return;}
  // 접힘 기본 · 안 읽은 코멘트가 있거나 부서장·관리자(쓰러 온 경우)면 펼침
  const un=L.filter(c=>c.unread).length;CMT.open=CMT.open||{};
  const open=CMT.open[r.id]!==undefined?CMT.open[r.id]:(un>0||viewer);
  const head='<h4 class="cmt-h" onclick="CMT.open=CMT.open||{};CMT.open[\''+esc(r.id)+'\']='+(!open)+';cmtRender()">💬 '+(viewer?'코멘트':'부서장 코멘트')+(L.length?' <span class="cmt-n">'+L.length+'</span>':'')+(un?' <span class="sg-new">새 '+un+'</span>':'')+(viewer?' <span class="muted" style="font-weight:400;font-size:12px">'+esc(S.viewAs)+'님에게 보임</span>':'')+'<span class="cmt-arr">'+(open?'▾':'▸')+'</span></h4>';
  if(!open){box.innerHTML='<div class="cmt folded">'+head+'</div>';return;}
  box.innerHTML='<div class="cmt">'+head+
    (L.length?L.map(c=>'<div class="cmi2'+(c.unread?' new':'')+'"><span class="who r-'+esc(c.role)+'">'+esc(c.author)+(c.role!=='사원'?' <span class="muted" style="font-weight:400">'+esc(c.role)+'</span>':'')+'</span><span class="tx">'+esc(c.text)+'</span><span class="tm">'+tsMD(c.ts)+' '+tsHM(c.ts)+'</span>'+(c.mine||S.master?'<button class="x" title="삭제" onclick="cmtDel(\''+esc(c.id)+'\')">×</button>':'')+'</div>').join(''):'<div class="hint">아직 코멘트 없음</div>')+
    '<div class="cmf2"><textarea id="cmtIn" class="inp" data-draft="cmt_'+esc(r.id)+'" rows="1" maxlength="500" placeholder="'+(viewer?'이 업체에 대한 코멘트 (사원 화면에 알림)':'답글 남기기')+'"></textarea><button class="btn primary sm" onclick="cmtAdd()">등록</button></div></div>';
  restoreDrafts(box);
}
async function cmtAdd(){
  const r=S.rows.find(x=>x.id===S.openId),inp=document.getElementById('cmtIn');if(!r||!inp)return;const t=inp.value.trim();if(!t){inp.focus();return;}
  inp.disabled=true;const res=await api('cmtAdd',{cid:r.id,company:r.company,text:t},true);inp.disabled=false;
  if(!res||!res.success){toast((res&&res.error)||'코멘트 저장 실패',2500);return;}
  clearDraft('cmt_'+r.id);CMT.items=res.items||[];CMT.inbox=res.inbox||[];cmtDot();cmtRender();
}
async function cmtDel(id){if(!confirm('코멘트를 지울까요?'))return;const res=await api('cmtDel',{id},true);if(!res||!res.success){toast((res&&res.error)||'삭제 실패',2500);return;}CMT.items=res.items||[];CMT.inbox=res.inbox||[];cmtDot();cmtRender();}
async function cmtMarkRead(cid){
  if(!CMT.items.some(c=>c.cid===cid&&c.unread))return;
  CMT.items.forEach(c=>{if(c.cid===cid)c.unread=false;});CMT.inbox=CMT.inbox.filter(c=>c.cid!==cid);cmtDot();
  const r=await api('cmtRead',{cid},true);if(r&&r.success){CMT.items=r.items||[];CMT.inbox=r.inbox||[];cmtDot();}
}
// 모아보기: 안 읽은 것 먼저, 이어서 최근 코멘트 (부서장·관리자는 다른 사원 것도 → 누르면 그 사원 화면으로)
function openInbox(){
  BB.view='inbox';const viewer=S.master||S.mgr,seen={};
  const un=CMT.inbox.slice().sort((a,b)=>a.ts<b.ts?1:-1);un.forEach(c=>seen[c.id]=1);
  const recent=CMT.items.filter(c=>!seen[c.id]).sort((a,b)=>a.ts<b.ts?1:-1).slice(0,30);
  const row=c=>'<div class="ib-i" onclick="inboxGo(\''+esc(c.owner)+'\',\''+esc(c.cid)+'\')">'+(viewer?'<span class="o">'+esc(c.owner)+'</span>':'')+'<span class="c">'+esc(c.company)+'</span><span class="t">'+esc(c.author)+': '+esc(c.text)+'</span><span class="muted" style="font-size:11px">'+tsMD(c.ts)+' '+tsHM(c.ts)+'</span></div>';
  openBm('<h3>💬 코멘트'+(viewer?' <span class="sg-sub">사원 답글 · 업체를 누르면 그 사원 카드가 열림</span>':' <span class="sg-sub">부서장 코멘트 · 업체를 누르면 카드가 열림</span>')+'</h3><div class="bm-list">'+
    '<div class="bm-day">새로 온 '+(viewer?'답글':'코멘트')+' '+un.length+'</div>'+(un.length?un.map(row).join(''):'<div class="bm-day" style="font-weight:400">없음</div>')+
    (recent.length?'<div class="bm-day">'+(viewer?esc(S.viewAs)+' · ':'')+'최근 코멘트</div>'+recent.map(row).join(''):'')+'</div>');
}
function inboxGo(owner,cid){
  closeBm();
  const viewer=S.master||S.mgr;
  if(viewer&&owner&&owner!==S.viewAs&&!(owner==='파일럿테스트'&&S.viewAs==='(테스트 시트)')){
    const v=owner==='파일럿테스트'?'(테스트 시트)':owner;S.pendingOpen=cid;
    const i=minf(v);S.pf={hq:i.hq,team:i.team};S.viewAs=v;buildPick();changeViewAs(v);S.pendingOpen=cid;return;}
  if(S.rows.some(x=>x.id===cid))openCard(cid);else toast('업체를 찾을 수 없음 (시트에서 삭제됐을 수 있음)',2500);
}

// ── 관리자: 사용현황 ──
const US={range:'week',data:null};
function usRangeDates(k){const t=S.today||ymd(new Date()),d=parseYmd(t),f=x=>ymd(x);
  if(k==='today')return [t,t];
  if(k==='week'){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return [f(m),t];}
  if(k==='lastweek'){const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7)-7);const e=new Date(m);e.setDate(m.getDate()+6);return [f(m),f(e)];}
  if(k==='month')return [t.slice(0,8)+'01',t];
  if(k==='lastmonth'){const a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);return [f(a),f(b)];}
  return [t,t];}
async function usRange(k){
  US.range=k;const [from,to]=usRangeDates(k);
  document.getElementById('usBar').innerHTML='<div class="bm-tabs">'+[['today','오늘'],['week','이번 주'],['lastweek','지난주'],['month','이번 달'],['lastmonth','지난달']].map(([a,l])=>'<button class="'+(a===k?'on':'')+'" onclick="usRange(\''+a+'\')">'+l+'</button>').join('')+'<span class="muted" style="font-size:12px;align-self:center;margin-left:6px">'+from+' ~ '+to+'</span></div>';
  document.getElementById('usBody').innerHTML='<div class="loading">사원 시트를 하나씩 읽는 중… (인원 수만큼 몇 초 걸림)</div>';
  const r=await api('usage',{from,to});const el=document.getElementById('usBody');if(!el||US.range!==k)return;
  if(!r||!r.success){el.innerHTML='<div class="empty">'+esc((r&&r.error)||'불러오기 실패')+' <span class="muted">(서버 p0.28 필요)</span></div>';return;}
  const z=n=>n?n:'<span class="z">0</span>';
  el.innerHTML='<table class="us-t"><thead><tr><th>이름</th><th>접속일</th><th>조회</th><th>신규등록</th><th>통화완료</th><th>부재</th><th>미루기</th><th>가망도변경</th><th>정보수정</th><th>되돌리기</th><th title="가망도변경로그 기준, 화면 기록을 뺀 나머지">시트 직접<br>신규 · 가망도</th><th>마지막 사용</th></tr></thead><tbody>'+
    r.rows.map(o=>'<tr><td><b>'+esc(o.name)+'</b>'+(o.error?' <span class="chip danger" title="'+esc(o.error)+'">읽기 실패</span>':'')+'</td><td>'+z(o.days)+'</td>'+r.acts.map(a=>'<td>'+z(o.c[a])+'</td>').join('')+'<td>'+(o.sheetNew||o.sheetGrade?'<span class="sh">'+o.sheetNew+' · '+o.sheetGrade+'</span>':'<span class="z">0 · 0</span>')+'</td><td class="muted">'+(o.last?tsMD(o.last)+' '+tsHM(o.last):'-')+'</td></tr>').join('')+
    '</tbody></table><div class="hint" style="margin-top:10px;line-height:1.6">· 기록은 p0.28 배포 시점부터 쌓임 · 마스터 보기·부서장 보기는 집계 안 함<br>· <b>시트 직접</b> = 그 기간 가망도변경로그(10분 감지)에 잡힌 신규·가망도 변경 중 화면에서 한 것을 뺀 수 → 높으면 아직 시트에서 직접 작업하는 비중이 큼</div>';
}

// ── v0.81 상단: 🔔 알림 하나로 (코멘트 · 수정건의), 이름 누르면 메뉴 (구글시트 · 수정건의 · 목표 · 관리계정 · 로그아웃) ──
function bellCount(){return (CMT.inbox||[]).length+(S.master?(SG.open||0):(SG.unread||0));}
function bellDot(){const d=document.getElementById('bellDot');if(!d)return;const n=bellCount();d.textContent=n;d.classList.toggle('hidden',!n);document.getElementById('bellBtn').title=n?'새 알림 '+n+'건':'알림';}
function closeMenus(){document.querySelectorAll('.hmenu').forEach(m=>m.classList.add('hidden'));}
document.addEventListener('click',e=>{if(!e.target.closest('.hmenu')&&!e.target.closest('#bellBtn')&&!e.target.closest('#whoName'))closeMenus();});
function toggleMenu(k,e){
  e.stopPropagation();const m=document.getElementById(k==='bell'?'bellMenu':'userMenu'),open=m.classList.contains('hidden');closeMenus();if(!open)return;
  if(k==='user'){
    const sl=document.getElementById('sheetLink'),viewer=S.master||S.mgr;
    m.innerHTML=(sl&&sl.href&&!sl.classList.contains('hidden')?'<a href="'+esc(sl.href)+'" target="_blank" rel="noopener" onclick="closeMenus()">📄 '+esc(sl.textContent.replace('📄 ',''))+'</a>':'')+
      '<button onclick="closeMenus();openSg()">💡 수정건의'+((S.master?SG.open:SG.unread)?'<span class="n">'+(S.master?SG.open:SG.unread)+'</span>':'')+'</button>'+
      (S.mgr?'':'<button onclick="closeMenus();goalEdit()">🎯 오늘 목표 설정 <span class="muted" style="margin-left:auto;font-size:12px">'+(S.goal?S.goal+'건':'미설정')+'</span></button>')+
      (S.mgr?'':'<button onclick="closeMenus();admMgrEditAny()">🔑 네이버 관리계정 번호</button>')+
      (AUTO_LOGIN?'':'<hr><button onclick="closeMenus();logout()">↩ 로그아웃</button>');
  }else{
    const it=[],viewer=S.master||S.mgr;
    (CMT.inbox||[]).slice().sort((a,b)=>a.ts<b.ts?1:-1).forEach(c=>it.push('<button class="bi" onclick="closeMenus();inboxGo(\''+esc(c.owner)+'\',\''+esc(c.cid)+'\')"><span>💬 '+(viewer?'<b>'+esc(c.owner)+'</b> · ':'')+esc(c.company)+'</span><small>'+esc(c.author)+': '+esc(c.text.length>40?c.text.slice(0,40)+'…':c.text)+' · '+tsMD(c.ts)+' '+tsHM(c.ts)+'</small></button>'));
    const sg=S.master?SG.open:SG.unread;
    if(sg)it.push('<button class="bi" onclick="closeMenus();openSg()"><span>💡 '+(S.master?'새 수정건의 '+sg+'건 (접수)':'수정건의 답변 도착 '+sg+'건')+'</span><small>눌러서 확인</small></button>');
    m.innerHTML='<div class="mh">알림</div>'+(it.length?it.join(''):'<div class="empty">새 알림 없음</div>')+'<hr><button onclick="closeMenus();openInbox()">💬 코멘트 모아보기</button>';
  }
  m.classList.remove('hidden');
}
async function admMgrEditAny(){if(!ADM.loaded){const r=await api('adList',{});if(r&&r.success){ADM.items=r.items||[];ADM.groups=r.groups||[];ADM.memos=r.memos||{};ADM.mgrNo=r.mgrNo||'';ADM.loaded=true;}}admMgrEdit();}
// 로고·제목 누르면 오늘 할 일(첫 화면)로 · 열린 카드·창 닫고 맨 위로
function goHome(){try{closeCard();closeMenus();}catch(e){}switchTab('today');window.scrollTo({top:0,behavior:'smooth'});}
// 헤더 높이 → --topH (테스트 배너·화면 폭에 따라 바뀜)
(function(){const t=document.querySelector('.top');if(!t)return;const f=()=>document.documentElement.style.setProperty('--topH',t.offsetHeight+'px');f();try{new ResizeObserver(f).observe(t);}catch(e){window.addEventListener('resize',f);}})();
init();
</script>
